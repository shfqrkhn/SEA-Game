name: Validate SEA artwork
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-artwork.yml
      - SEA_Instructor_Standalone.html
      - SEA_Student_Standalone.html
      - assets/v1/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, official repository
        with:
          persist-credentials: false
      - name: Validate standalone app scripts and release invariants
        run: |
          python3 - <<'PY'
          import re
          import subprocess
          import tempfile
          from pathlib import Path

          for name in ("SEA_Instructor_Standalone.html", "SEA_Student_Standalone.html"):
              html = Path(name).read_text(encoding="utf-8")
              scripts = re.findall(r"<script>(.*?)</script>", html, re.I | re.S)
              assert len(scripts) == 1, (name, len(scripts))
              assert html.count("<svg ") >= 77, (name, "missing embedded vector artwork")
              assert "const initial=(navigator.onLine===false||location.protocol==='file:')?local:remote;" in html, (name, "automatic artwork fallback absent")
              assert "border-radius:0!important" in html, (name, "square-edge styling absent")
              assert "Clean Minimal is the only visual system" in html
              assert not re.search(r"seaQa|seaPhases|seaTheme|SEA_THEMES|data-sea-theme|id=\"seaTheme\"", html), (name, "retired controls remain")
              with tempfile.NamedTemporaryFile(suffix=".js", mode="w", encoding="utf-8") as f:
                  f.write(scripts[0])
                  f.flush()
                  subprocess.run(["node", "--check", f.name], check=True)
              print(name, "script syntax and release invariants OK")
          PY
      - name: Verify 77 SVG and WebP artwork pairs
        run: |
          python3 - <<'PY'
          import struct
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = Path("assets/v1")
          svg = {p.relative_to(root).with_suffix("") for p in root.rglob("*.svg")}
          webp = {p.relative_to(root).with_suffix("") for p in root.rglob("*.webp")}
          assert len(svg) == len(webp) == 77, (len(svg), len(webp))
          assert svg == webp, (sorted(svg-webp), sorted(webp-svg))
          for item in sorted(svg):
              ET.parse(root / item.with_suffix(".svg"))
              data = (root / item.with_suffix(".webp")).read_bytes()
              assert len(data) >= 20 and data[:4] == b"RIFF" and data[8:12] == b"WEBP", str(item)
              assert struct.unpack_from("<I", data, 4)[0] + 8 == len(data), str(item)
          print("Validated", len(svg), "SVG/WebP artwork pairs")
          PY
