<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-DoEI0tjiLZ4oLPCBe82XrEqw5BJgM3npc1Zb301zb3o='; script-src-attr 'none'; style-src 'unsafe-inline'; img-src 'self' file: https://shfqrkhn.github.io/SEA-Game/assets/v1/; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#252a27">
<title>Systems Engineering Awareness</title>
<style>
:root{
  color-scheme:light;
  --canvas:#f4f2ed;
  --surface:#fffdf8;
  --surface-2:#ece9e1;
  --surface-3:#dedbd2;
  --ink:#1f2320;
  --muted:#5f665f;
  --line:#cbc7bd;
  --line-strong:#8f958f;
  --charcoal:#252a27;
  --slate:#3f4a45;
  --blue:#3f647a;
  --olive:#5e6f58;
  --amber:#a75f24;
  --green:#416745;
  --red:#8a3f3b;
  --focus:#0b57d0;
  --shadow:0 1px 2px rgba(22,27,23,.08);
  --r-sm:4px;
  --r-md:6px;
  --s1:4px;
  --s2:8px;
  --s3:12px;
  --s4:16px;
  --s5:24px;
  --s6:32px;
}
*{box-sizing:border-box}
html{scroll-padding-top:88px}
body{
  margin:0;
  background:var(--canvas);
  color:var(--ink);
  font-family:"Segoe UI",system-ui,-apple-system,BlinkMacSystemFont,Arial,sans-serif;
  font-size:16px;
  line-height:1.45;
  text-rendering:optimizeLegibility;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{color:var(--blue)}
.hidden{display:none!important}
.skip-link{
  position:fixed;left:8px;top:8px;z-index:1000;
  transform:translateY(-160%);
  background:#fff;color:#111;border:2px solid var(--focus);
  padding:8px 12px;border-radius:var(--r-sm);
}
.skip-link:focus{transform:none}

header{
  position:sticky;top:0;z-index:20;
  display:flex;justify-content:space-between;align-items:center;gap:var(--s4);
  min-height:64px;padding:10px 20px;
  background:var(--charcoal);color:#fff;
  border-bottom:1px solid #101311;
}
.brand{display:flex;gap:12px;align-items:center;min-width:0}
.mark{
  width:32px;height:32px;display:grid;place-items:center;
  background:#fff;color:var(--charcoal);
  border-radius:var(--r-sm);font-weight:700;letter-spacing:.02em;
  flex:0 0 auto;
}
.brand h1{font-size:16px;line-height:20px;font-weight:650;margin:0}
.brand small{display:block;color:#cfd5d0;font-size:12px;margin-top:2px}
.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.status{
  display:flex;gap:8px;align-items:center;flex-wrap:wrap;
  min-height:40px;padding:6px 20px;
  background:#e8e6df;color:var(--ink);
  border-bottom:1px solid var(--line);
}
.badge{
  display:inline-flex;align-items:center;min-height:28px;
  border:1px solid var(--line-strong);border-radius:var(--r-sm);
  padding:3px 8px;background:transparent;color:var(--ink);
  font-size:12px;font-weight:600;
}

main{max-width:1180px;margin:0 auto;padding:var(--s6) 24px 48px}
.section{display:none}
.section.active{display:block}
.section>*+*{margin-top:var(--s4)}
.hero{max-width:920px;margin-bottom:var(--s5)}
.hero h2{
  margin:4px 0 8px;
  font-size:clamp(28px,4vw,40px);
  line-height:1.1;letter-spacing:-.025em;font-weight:680;
}
.hero p{margin:0;color:var(--muted);max-width:78ch}
.kicker{
  color:var(--amber);
  font-size:13px;line-height:18px;font-weight:650;
  letter-spacing:0;text-transform:none;
}

.grid{display:grid;gap:var(--s4)}
.section>.grid,.auction{align-items:start}
.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.auction{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(320px,.8fr);gap:var(--s4)}
.auction>*,.grid>*,.card,.gamecard{min-width:0}

.card{
  background:var(--surface);color:var(--ink);
  border:1px solid var(--line);border-radius:var(--r-md);
  padding:var(--s4);box-shadow:var(--shadow);
}
.card.subtle{background:var(--surface-2);box-shadow:none}
.card h3,.card h4{margin-top:0}
.card h3{font-size:18px;line-height:24px;font-weight:650;margin-bottom:12px}
.card h4{font-size:15px;line-height:20px;font-weight:650;margin-bottom:8px}

.field{display:grid;gap:6px;margin-bottom:var(--s3)}
.field label{font-weight:600;font-size:14px}
.field input,.field select,.field textarea{
  width:100%;min-height:44px;padding:9px 10px;
  border:1px solid #949991;border-radius:var(--r-sm);
  background:#fff;color:var(--ink);
}
.field textarea{min-height:88px;resize:vertical}
.field input:hover,.field select:hover,.field textarea:hover{border-color:#626862}

.btn{
  min-height:44px;padding:8px 14px;
  border:1px solid #838a83;border-radius:var(--r-sm);
  background:#fff;color:var(--ink);
  font-weight:600;line-height:1.2;
  box-shadow:none;
}
.btn:hover:not(:disabled){background:#f1efe9}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover:not(:disabled){background:#34586c}
.btn.secondary{background:var(--slate);border-color:var(--slate);color:#fff}
.btn.secondary:hover:not(:disabled){background:#333e39}
.btn.good{background:var(--green);border-color:var(--green);color:#fff}
.btn.good:hover:not(:disabled){background:#365a3a}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn.danger:hover:not(:disabled){background:#763632}
.btn.ghost{background:transparent;color:#fff;border-color:#727a74}
.btn.ghost:hover:not(:disabled){background:#333a35}
.btn:disabled{opacity:.46;cursor:not-allowed}

button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,a:focus-visible{
  outline:3px solid var(--focus);
  outline-offset:2px;
}
summary{cursor:pointer;border-radius:var(--r-sm)}
details{border-top:1px solid var(--line);padding-top:var(--s3);margin-top:var(--s3)}
details[open] summary{margin-bottom:var(--s3)}

.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.space{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.muted{color:var(--muted)}

.notice{
  padding:10px 12px;
  border:1px solid #d5b98d;border-left:4px solid var(--amber);
  border-radius:var(--r-sm);background:#f7efe3;color:#3c3025;
}
.notice.info{border-color:#9fb6c4;border-left-color:var(--blue);background:#eaf0f3;color:#263943}
.notice.good{border-color:#a7bea8;border-left-color:var(--green);background:#ebf1e9;color:#29402b}
.notice.bad{border-color:#d1a7a3;border-left-color:var(--red);background:#f5e9e7;color:#512e2b}

.metric{
  min-width:0;border-top:2px solid var(--line-strong);
  padding:10px 0 4px;background:transparent;
}
.metric .label{
  font-size:12px;line-height:16px;font-weight:600;
  color:var(--muted);text-transform:none;letter-spacing:0;
}
.metric .value{
  margin-top:3px;font-size:21px;line-height:26px;font-weight:680;
  font-variant-numeric:tabular-nums;
  overflow-wrap:anywhere;
}

.market{
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;
}
.market-card{
  min-width:0;border:1px solid var(--line);
  background:var(--surface);border-radius:var(--r-sm);padding:10px;
}
.market-card.current{
  border-color:var(--amber);
  box-shadow:inset 0 0 0 2px var(--amber);
  outline:0;
}
.market-card.hiddenlot{background:var(--surface-2);color:#6b6d69}
.slot{font-size:12px;line-height:16px;font-weight:650;color:var(--muted);text-transform:none;letter-spacing:0}

.gamecard{
  background:var(--surface);color:var(--ink);
  border:1px solid #8d938d;border-radius:var(--r-md);overflow:hidden;
  box-shadow:var(--shadow);
}
.gamecard .band{
  display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;
  padding:8px 12px;background:var(--slate);color:#fff;
  font-size:13px;font-weight:600;
}
.gamecard .body{padding:var(--s4)}
.art{
  height:156px;border:1px solid var(--line);border-radius:var(--r-sm);
  overflow:hidden;background:#f0ede5;
}
.art svg{width:100%;height:100%;display:block}

.effects{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
  gap:8px;margin:12px 0;
}
.effect{
  min-width:0;border:1px solid var(--line);border-radius:var(--r-sm);
  padding:8px;text-align:left;background:#faf8f2;color:var(--ink);
}
.effect strong{display:block;font-size:18px;line-height:22px;font-weight:680;font-variant-numeric:tabular-nums}
.effect small{color:var(--muted)}
.price{font-size:28px;line-height:34px;font-weight:680;font-variant-numeric:tabular-nums}

.team-buttons{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:8px;
}
.ledger{
  min-width:0;max-width:100%;max-height:380px;overflow:auto;
  border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);
}
.ledger-row{
  display:grid;grid-template-columns:44px 44px minmax(0,1fr) 90px 110px;
  gap:8px;align-items:center;padding:9px 10px;
  border-bottom:1px solid #e2dfd7;font-size:13px;
}
.ledger-row:last-child{border-bottom:0}
.bid-row{grid-template-columns:64px minmax(0,1fr) minmax(112px,auto)}
.bid-team-meta{min-width:0;overflow-wrap:anywhere}
.bid-team-meta small{display:block;margin-top:2px;color:var(--muted);font-size:12px;line-height:16px}
.bid-row .btn{width:100%;min-width:0}

.workflow{
  display:flex;gap:4px;flex-wrap:wrap;margin:8px 0 16px;
  border-bottom:1px solid var(--line);padding-bottom:10px;
}
.workflow span{
  padding:5px 8px;border:0;border-radius:var(--r-sm);
  background:transparent;color:var(--muted);font-size:13px;font-weight:600;
}
.workflow .current{background:#efe1d3;color:#713b16}

.req{width:100%;border-collapse:collapse}
.req th,.req td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.req th{font-size:12px;color:var(--muted);font-weight:650}
.pass{color:var(--green);font-weight:650}
.fail{color:var(--red);font-weight:650}

.inventory{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;
}
.inv{
  min-width:0;border:1px solid var(--line);border-radius:var(--r-sm);
  padding:10px;background:var(--surface);
}
.footer{
  margin-top:32px;padding-top:16px;border-top:1px solid var(--line);
  color:var(--muted);font-size:13px;line-height:19px;
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}
}
@media (forced-colors:active){
  .btn,.card,.gamecard,.market-card,.notice,.ledger,.inv,.badge{forced-color-adjust:auto}
  .market-card.current{outline:2px solid CanvasText;outline-offset:2px;box-shadow:none}
}
@media(max-width:900px){
  main{padding:24px 16px 40px}
  .two,.three,.auction{grid-template-columns:1fr}
  .market{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:520px){
  html{scroll-padding-top:120px}
  header{position:static;align-items:flex-start;padding:10px 12px}
  .brand small{max-width:26ch}
  .status{padding:6px 12px}
  main{padding:20px 12px 32px}
  .hero h2{font-size:28px}
  .market{grid-template-columns:1fr}
  .effects{grid-template-columns:repeat(2,minmax(0,1fr))}
    .ledger-row{grid-template-columns:36px 36px minmax(0,1fr) 60px 76px;font-size:12px;gap:5px;padding:8px 6px}
  .gamecard .band>*{min-width:0;overflow-wrap:anywhere}
  .bid-row{grid-template-columns:52px minmax(0,1fr) minmax(104px,auto)}
  .bid-row .btn{padding-inline:8px;font-size:12px}
}
@media(max-width:360px){
  .effects{grid-template-columns:1fr}
  .inline>.btn{flex:1 1 100%}
}

.team-summary{display:grid;gap:10px}
.purchase-list{display:grid;gap:6px;margin-top:8px}
.purchase-row{display:grid;grid-template-columns:72px minmax(0,1fr) 100px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.purchase-row:last-child{border-bottom:0}
.reconcile-actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;align-items:end}
.code-box{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:18px;letter-spacing:.04em}
.callout-rule{border-left:4px solid var(--blue);padding:10px 12px;background:#eef3f5;border-radius:var(--r-sm)}
@media(max-width:700px){.reconcile-actions{grid-template-columns:1fr 1fr}.purchase-row{grid-template-columns:56px minmax(0,1fr) 88px}}
@media(max-width:420px){.reconcile-actions{grid-template-columns:1fr}.purchase-row{grid-template-columns:1fr}.purchase-row .btn{width:100%}}

.sr-only{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
.vehicle-preview{margin:12px 0}.vehicle-preview p{margin:8px 0}.vehicle-counts{line-height:1.8}
.check-label{display:flex;align-items:flex-start;gap:10px;padding:12px 0;cursor:pointer}.check-label input{margin-top:4px;min-width:22px;min-height:22px}
.inv label{display:block}.req{table-layout:fixed}.req td,.req th{overflow-wrap:anywhere}.badge,.code-box{overflow-wrap:anywhere;max-width:100%}
@media(max-width:520px){.bid-row{grid-template-columns:48px minmax(0,1fr)!important}.bid-row .btn{grid-column:1 / -1}.ledger-row{overflow-wrap:anywhere}.req{font-size:14px}}
@media(pointer:coarse){button,select,input{min-height:44px}}
.art img{max-width:100%}

/* SEA visual system: classroom-readable, responsive, keyboard-first */
:root{--canvas:#e8edf0;--surface:#fff;--surface-2:#edf2f4;--surface-3:#dce4e8;--ink:#142630;--muted:#465964;--line:#bbcbd1;--line-strong:#7e98a3;--charcoal:#102733;--slate:#24485a;--blue:#245e7c;--olive:#526b54;--amber:#995018;--green:#27663f;--red:#a03637;--focus:#085ed0;--shadow:0 3px 16px rgba(10,35,49,.07);--r-sm:7px;--r-md:12px}
body{background:linear-gradient(180deg,#e1ebef 0,#f4f6f6 330px,#e8edf0 100%);min-height:100vh}
header{background:#102733;border-bottom:3px solid #417a90;box-shadow:0 5px 20px rgba(10,35,49,.2)}
.mark{border-radius:7px;background:#dcebee;color:#102733;letter-spacing:-.04em;box-shadow:inset 0 -2px 0 #b6c9ce}
.status{background:#dce7ec;border-color:#a8bdc7}
main{max-width:1360px}
.hero{border-left:5px solid #39768f;padding:4px 0 6px 20px;max-width:1000px}
.hero h2{color:#132f3e;letter-spacing:-.035em}
.kicker{color:#8b4717;font-weight:750;letter-spacing:.025em}
.card,.gamecard,.market-card,.inv{box-shadow:0 4px 18px rgba(17,44,57,.06);border-color:#bdcbd0}
.card,.gamecard{border-radius:12px}
.card h3,.gamecard h3{color:#16384a}
.btn{border-radius:7px;transition:background-color .13s ease,border-color .13s ease,box-shadow .13s ease,transform .13s ease}
.btn.primary{background:#245e7c;border-color:#245e7c}
.btn.primary:hover:not(:disabled){background:#194c68}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:focus-visible,.field input:focus-visible,.field select:focus-visible,.field textarea:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.field input,.field select,.field textarea{border-radius:7px;max-width:100%;background:#fff}
.card .notice,.notice{border-radius:7px}
.gamecard .band{background:linear-gradient(100deg,#163646,#34576a);min-height:44px;align-items:center}
.art{height:clamp(150px,21vw,242px);background:#e8e5dc;position:relative}
.art>div{height:100%}.art svg,.art img{height:100%;width:100%;display:block}
.market-card{min-height:104px;transition:box-shadow .15s ease}
.market-card.current{box-shadow:inset 0 0 0 2px #9b571e,0 4px 16px rgba(29,49,61,.08)}
.effect{background:#f1f5f6;border-color:#d4e0e5;border-radius:7px}
.metric{border-top-color:#3d7188}.metric .value{font-size:clamp(20px,2vw,27px);line-height:1.25}
.workflow span{border-radius:7px}.workflow .current{background:#e7d1b9;color:#68370c}
.ledger-row{font-variant-numeric:tabular-nums}.ledger-row:nth-child(2n){background:#f4f7f8}
.purchase-row{min-width:0;overflow-wrap:anywhere}
@media(max-width:900px){.hero{padding-left:14px}.art{height:clamp(160px,43vw,270px)}}
@media(max-width:520px){main{padding:18px 12px 36px}.hero h2{font-size:clamp(25px,8vw,32px)}.card,.gamecard .body{padding:14px}.art{height:clamp(150px,52vw,220px)}.market-card{min-height:80px}.metric .value{font-size:22px}}
@media(prefers-reduced-motion:reduce){.btn,.market-card{transition:none!important}}
@media print{header{position:static}.btn{box-shadow:none}body{background:#fff}.card,.gamecard,.inv{break-inside:avoid;box-shadow:none}main{max-width:none}}

.sea-settings{max-width:1180px;margin:12px auto;padding:16px 22px;border:2px solid var(--line-strong);border-radius:8px;background:var(--surface);box-shadow:var(--shadow)}
.sea-settings.hidden,.sea-settings .hidden{display:none!important}
.sea-settings label:not(.sea-checkbox){display:block;font-weight:650;margin-top:10px}
.sea-settings select{display:block;max-width:100%;width:360px;min-height:44px;margin:5px 0 10px;background:white;color:var(--ink);border:1px solid var(--line-strong);border-radius:5px;padding:7px}
.sea-settings .sea-checkbox{display:flex;gap:10px;align-items:center;margin:12px 0}
.sea-settings input[type=checkbox]{width:22px;height:22px}
.sea-settings .sea-hint{color:var(--muted);font-size:14px}
@media(max-width:520px){.sea-settings{padding:12px;margin:8px 12px}}

/* Dense desktop layout: retain 44px hit targets and responsive breakpoints. */
@media (min-width:1000px) and (min-height:700px){
 main{max-width:1360px;padding:14px 20px 28px}
 .section>*+*{margin-top:10px}
 .hero{margin-bottom:10px}
 .hero h2{font-size:30px;margin:2px 0 4px}
 .card{padding:12px}
 .card h3{margin-bottom:7px}
 .grid,.auction{gap:12px}
 .art{height:clamp(145px,16vh,200px)}
 .field{margin-bottom:8px}
}

.mark{background:#b9d6c2;color:#17372c;border-radius:9px}
.brand h1{font-weight:750;letter-spacing:.025em}
.status{padding:4px clamp(12px,2vw,24px);min-height:36px;background:#dce7df;gap:6px}
.badge{min-height:24px;border-radius:7px;background:#fff9;border-color:#b3c4b7;font-size:11px;letter-spacing:.02em}
main{max-width:1480px;padding:clamp(10px,1.4vw,20px) clamp(12px,2vw,26px) 28px}
.section>*+*{margin-top:10px}
.hero{max-width:none;margin-bottom:10px;display:flex;align-items:baseline;column-gap:15px;row-gap:3px;flex-wrap:wrap}
.hero h2{font-size:clamp(23px,2.35vw,32px);line-height:1.13;margin:0;letter-spacing:-.03em}
.hero p{font-size:13px;line-height:1.35;margin:0;max-width:66ch}
.kicker{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:#436759}
.card{padding:clamp(11px,1.15vw,16px);box-shadow:var(--shadow)}
.card h3{font-size:16px;line-height:1.3;margin-bottom:8px}
.card h4{margin-bottom:5px}
.grid,.auction{gap:clamp(8px,1.2vw,15px)}
.field{gap:4px;margin-bottom:8px}
.field label{font-size:12px;letter-spacing:.02em}
.field input,.field select,.field textarea{min-height:42px;padding:7px 10px}
.field textarea{min-height:70px}
.btn{border-radius:8px;padding:8px 12px;box-shadow:none}
.btn.primary{background:#17677a;border-color:#17677a}
.btn:active:not(:disabled){transform:translateY(1px)}
.notice{padding:8px 11px;font-size:13px}
details{padding-top:8px;margin-top:8px}
@media (min-width:1100px) and (min-height:680px){
 main{padding-top:10px}
 .section>*+*{margin-top:8px}
 .hero{margin-bottom:8px}
 .auction{grid-template-columns:minmax(0,1.23fr) minmax(310px,.86fr)}
 .art{height:clamp(135px,18vh,230px)}
}
@media (max-width:700px){
 header{align-items:flex-start;gap:8px}
 .hero{display:block}
 .hero h2{margin:2px 0 5px}
 .hero p{font-size:13px}
 .card{padding:12px}
 .grid,.auction{gap:10px}
}
@media(prefers-reduced-motion:reduce){.btn:active:not(:disabled){transform:none}}


/* Clean Minimal is the only visual system. */
:root{--canvas:#f7f7f4;--surface:#fff;--surface-2:#f0f2ee;--ink:#17272b;--muted:#58686b;--line:#d7dedb;--line-strong:#9aa9a5;--charcoal:#fefefd;--slate:#466d62;--blue:#1a5b52;--olive:#50775c;--amber:#865e23;--green:#286b56;--red:#9c4747;--r-md:0;--r-sm:0;--shadow:none}
header{background:#fff;color:#17272b;border-bottom:2px solid #cbd9d1;box-shadow:none}
.brand small{color:#49645a}.mark{background:#245b4e;color:#fff}.btn.ghost{color:#19352a;background:transparent;border-color:#8ba99c}.btn.ghost:hover:not(:disabled){background:#e2eee7;color:#19352a}
.status{background:#f0f3ef;color:#18362b}.hero h2{color:#17272b;font-weight:480;letter-spacing:-.04em}.card h3,.gamecard h3{color:#19352a}.card,.gamecard{border-color:#e3e8e2;border-width:0 0 1px;box-shadow:none}
.notice.info{color:#263943}.notice.good{color:#29402b}.notice.bad{color:#512e2b}
*,*::before,*::after{border-radius:0!important}
@media(min-width:901px){main{max-width:1180px}}
@media(max-width:600px){.hero h2{font-size:clamp(23px,7vw,31px)}.auction{grid-template-columns:minmax(0,1fr)}}

/* Compact, light, square-edge classroom layout. */
.vehicle-preview .vehicle-art{height:120px;margin-block:8px}
:root{color-scheme:light;--canvas:#f8faf8;--surface:#fff;--surface-2:#f2f6f4;--ink:#182a27;--muted:#52625d;--line:#ccd8d2;--shadow:none}
header{background:#fff;color:var(--ink);box-shadow:none;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;min-height:48px;padding:6px 16px}
main{max-width:1440px;padding:12px 18px 24px}
.status{min-height:28px;padding:3px 18px;background:#eef4f1}
.hero{margin-bottom:6px;padding:0;border-left:0;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.hero h2{font-size:clamp(21px,2vw,28px)}.hero p{font-size:12px;max-width:64ch}
.section>*+*{margin-top:8px}.auction,.grid{gap:9px}.card{padding:10px}.card h3{font-size:15px;line-height:1.25;margin-bottom:7px}
.market{gap:5px}.market-card{min-height:65px;padding:6px;font-size:12px}.market-card strong{font-size:12px}
.auction{grid-template-columns:minmax(0,1.15fr) minmax(360px,1fr)}.auction>.grid{gap:8px}.art{height:clamp(140px,20vh,220px)}
.gamecard .body{padding:10px}.metric{padding:6px}.metric .value{font-size:clamp(18px,1.7vw,24px)}
.btn{min-height:34px;padding:5px 9px}.field{margin-bottom:7px}.field input,.field select,.field textarea{min-height:36px;padding:6px 8px}
*,:before,:after{border-radius:0!important}
@media(max-width:900px){.auction{grid-template-columns:1fr}main{padding:10px 12px}.hero{display:block}.market{grid-template-columns:repeat(2,minmax(0,1fr))}}

<a class="skip-link" href="#mainContent"><span data-i18n="common.skip"></span></a>
<header>
  <div class="brand"><div class="mark">SE</div><div><h1 data-i18n="app.title">Systems Engineering Awareness</h1><small data-i18n="role"></small></div></div>
  <div class="top"><button id="exportBackupBtn" class="btn ghost" type="button" data-i18n="backup.export"></button><button id="importBackupBtn" class="btn ghost" type="button" data-i18n="backup.import"></button><button id="restorePreviousBtn" class="btn ghost" type="button" data-i18n="backup.restorePrevious" disabled></button><input id="backupFile" class="sr-only" type="file" accept="application/json,.json" tabindex="-1" aria-hidden="true"><button id="langBtn" class="btn ghost" type="button">FR</button></div>
</header>
<div id="storageNotice" class="notice bad hidden" role="status"></div><div id="backupStatus" class="notice info hidden" role="status" aria-live="polite"></div><div class="status"><span class="badge">v3.0.0-local</span><span class="badge" data-i18n="role"></span><span id="phaseBadge" class="badge"></span><span id="sessionBadge" class="badge"></span></div>
<main id="mainContent">
<section id="setup" class="section active">
  <div class="hero"><div class="kicker" data-i18n="setup.kicker"></div><h2 data-i18n="setup.title"></h2><p data-i18n="setup.desc"></p></div>
  <div class="grid two">
    <div class="card">
      <div class="field"><label for="teamCount" data-i18n="setup.teams"></label><select id="teamCount"></select></div>
      <div class="callout-rule"><strong data-i18n="setup.reveal.round"></strong></div><details><summary><strong data-i18n="setup.otherReveal"></strong></summary><div class="field" style="margin-top:10px"><label for="revealMode" data-i18n="setup.reveal"></label><select id="revealMode"><option value="ROUND" data-i18n="setup.reveal.round"></option><option value="JIT" data-i18n="setup.reveal.jit"></option><option value="MANUAL" data-i18n="setup.reveal.manual"></option></select></div></details>
      <div class="grid two">
        <div class="field"><label for="timingMode" data-i18n="setup.timing"></label><select id="timingMode"><option value="TIMED" data-i18n="setup.timed"></option><option value="UNTIMED" data-i18n="setup.untimed"></option></select></div>
        <div class="field"><label for="bidSeconds" data-i18n="setup.bidWindow"></label><input id="bidSeconds" type="number" min="10" max="120" step="5" value="30"></div>
      </div>
      <p><button id="generateBtn" class="btn primary" type="button" data-i18n="setup.generate"></button></p>
      <div id="setupStatus" class="notice info" role="status" aria-live="polite"></div>
      <div id="recoveryStatus" class="notice info" role="status" aria-live="polite" data-i18n="setup.recovery"></div>
    </div>
    <div class="card subtle">
      <h3 data-i18n="setup.sessionCode"></h3>
      <div id="sessionCode" class="metric"><div class="value code-box">-</div></div>
      <p data-i18n="setup.assignmentNote"></p>
      <div class="callout-rule" data-i18n="setup.privateMarket"></div><p class="muted" data-i18n="setup.randomHonesty"></p>
      <p data-i18n="vehicle.instructorHint"></p><div id="setupVehicleStatus" class="notice info" role="status"></div><div id="assignmentList" class="inventory" style="margin-top:12px"></div>
      <p><button id="startTutorialBtn" class="btn good" type="button" disabled data-i18n="setup.startTutorial"></button></p>
    </div>
  </div>
</section>

<section id="practice" class="section">
  <div class="hero"><div class="kicker" data-i18n="practice.kicker"></div><h2 data-i18n="practice.title"></h2><p data-i18n="practice.desc"></p></div>
  <div class="auction">
    <div class="gamecard"><div class="band"><span data-i18n="category.CAPACITY"></span><span>TRAIN-CAP</span></div><div class="body"><div class="art" id="practiceArt" aria-label="Training capacity illustration"></div><h3 data-i18n="practice.cardTitle"></h3><div class="effects"><div class="effect"><span data-i18n="practice.capacity"></span><strong>+4</strong><small data-i18n="practice.persons"></small></div><div class="effect"><span data-i18n="practice.mobility"></span><strong>-10</strong><small>km/h</small></div></div><div class="price" data-practice-price></div></div></div>
    <div class="card">
      <div id="practiceStatus" class="notice info" role="status" aria-atomic="true"></div>
      <p class="inline"><button id="practiceReveal" class="btn secondary" type="button" data-i18n="practice.reveal"></button><button id="practiceOpen" class="btn primary" type="button" data-i18n="practice.open"></button><button id="practiceAccept" class="btn" type="button" data-i18n="practice.accept"></button><button id="practiceClose" class="btn danger" type="button" data-i18n="practice.close"></button></p>
      <p class="inline"><button id="practiceReset" class="btn" type="button" data-i18n="practice.reset"></button><button id="toPlanning" class="btn good" type="button" disabled data-i18n="practice.toPlanning"></button></p>
    </div>
  </div>
</section>

<section id="planning" class="section">
  <div class="hero"><div class="kicker" data-i18n="planning.kicker"></div><h2 data-i18n="planning.title"></h2><p data-i18n="planning.desc"></p></div>
  <div class="card"><p data-i18n="vehicle.instructorHint"></p><div id="planningVehicleStatus" class="notice info" role="status"></div><div id="vehicleMix" class="notice info"></div><div id="planningTeams" class="inventory"></div><p><button id="startAuctionBtn" class="btn primary" type="button" data-i18n="planning.startAuction"></button></p></div>
</section>

<section id="auction" class="section">
  <div class="hero"><div class="kicker" data-i18n="auction.kicker"></div><h2 data-i18n="auction.title"></h2><p id="auctionRule"></p></div>
  <div class="workflow" id="workflow"></div>
  <div class="card"><div class="space"><h3 id="roundHeading"></h3><span id="lotBadge" class="badge"></span></div><div id="market" class="market"></div></div>
  <div class="auction">
    <div class="gamecard"><div class="band"><span id="cardCat"></span><span id="cardId"></span></div><div class="body"><div class="art" id="cardArt"></div><h3 id="cardTitle"></h3><div id="cardEffects" class="effects"></div><div class="space"><strong id="startPrice"></strong><strong id="leaderText"></strong></div></div></div>
    <div class="grid">
      <div class="card">
        <h3 data-i18n="auction.title"></h3>
        <div class="grid three">
          <div class="metric"><div class="label" data-i18n="auction.currentLeader"></div><div class="value" id="leaderSummary">-</div></div>
          <div class="metric"><div class="label" data-i18n="auction.nextLegal"></div><div class="value" id="nextBid">-</div></div>
          <div class="metric"><div class="label" data-i18n="auction.time"></div><div class="value" id="timerValue">-</div></div>
        </div>
        <p class="inline"><button id="revealBtn" class="btn secondary" type="button" data-i18n="auction.reveal"></button><button id="openBtn" class="btn primary" type="button" data-i18n="auction.open"></button><button id="pauseBtn" class="btn" type="button" data-i18n="auction.pause"></button><button id="extendBtn" class="btn" type="button" data-i18n="auction.extend"></button></p>
        <h4 data-i18n="auction.acceptCaller"></h4><p class="muted" data-i18n="auction.acceptDesc"></p><div id="bidRoster" class="ledger"></div>
        <hr><h4 data-i18n="auction.commitTitle"></h4><div id="commitSummary" class="notice info"></div>
        <p class="inline"><button id="commitLeaderBtn" class="btn danger" type="button" data-i18n="auction.commitLeader"></button><button id="commitUnsoldBtn" class="btn" type="button" data-i18n="auction.commitUnsold"></button></p>
        <details><summary><strong data-i18n="auction.correct"></strong></summary><p class="muted" data-i18n="auction.correctDesc"></p><div class="grid two"><div class="field"><label for="winnerSelect" data-i18n="auction.winner"></label><select id="winnerSelect"></select></div><div class="field"><label for="finalPrice" data-i18n="auction.finalPrice"></label><input id="finalPrice" inputmode="numeric" maxlength="12"></div></div><div class="field"><label for="saleCorrectionReason" data-i18n="auction.correctionReason"></label><input id="saleCorrectionReason" maxlength="120"><small data-i18n="common.warningInfo"></small></div><button id="commitCorrectedBtn" class="btn danger" type="button" data-i18n="auction.commitCorrected"></button></details>
        <div id="timerAnnouncement" class="sr-only" role="status" aria-live="polite"></div><div id="commitStatus" class="notice info" role="status" aria-live="polite"></div>
        <details><summary><strong data-i18n="auction.correction"></strong></summary><p class="muted" data-i18n="auction.correctionDesc"></p><div class="field"><label for="correctionReason" data-i18n="auction.correctionReason"></label><input id="correctionReason" maxlength="120"><small class="muted" data-i18n="common.warningInfo"></small></div><button id="voidCurrentBtn" class="btn danger" type="button" data-i18n="auction.void"></button></details>
        <p><button id="advanceBtn" class="btn good" type="button" data-i18n="auction.advance"></button></p>
      </div>
      <details class="card"><summary><strong data-i18n="auction.ledger"></strong></summary><div id="ledger" class="ledger"></div></details>
    </div>
  </div>
</section>

<section id="build" class="section">
  <div class="hero"><div class="kicker" data-i18n="build.kicker"></div><h2 data-i18n="build.title"></h2><p data-i18n="build.desc"></p></div>
  <div id="authoritativeBuild" class="grid two"></div>
  <p><button id="openSubmissionsBtn" class="btn primary" type="button" data-i18n="build.openSubmissions"></button></p>
</section>

<section id="submit" class="section">
  <div class="hero"><div class="kicker" data-i18n="submit.kicker"></div><h2 data-i18n="submit.title"></h2><p data-i18n="submit.desc"></p></div>
  <div class="notice info" data-i18n="submit.incentive"></div>
  <div id="privateSubmitGuard" class="notice info"><p data-i18n="submit.privateHint"></p><button id="privateSubmitBtn" class="btn" type="button" data-i18n="submit.privateOpen"></button></div><div id="submissionRows" class="card"></div>
  <p><button id="closeSubmissionsBtn" class="btn primary" type="button" data-i18n="submit.close"></button></p>
</section>

<section id="debrief" class="section">
  <div class="hero"><div class="kicker" data-i18n="debrief.kicker"></div><h2 data-i18n="debrief.title"></h2></div>
  <div class="grid two"><div id="ranking" class="card"></div><div class="card"><h3 data-i18n="debrief.prompts"></h3><ol><li data-i18n="debrief.p1"></li><li data-i18n="debrief.p2"></li><li data-i18n="debrief.p3"></li><li data-i18n="debrief.p4"></li><li data-i18n="debrief.p5"></li><li data-i18n="debrief.p6"></li><li data-i18n="debrief.p7"></li><li data-i18n="debrief.p8"></li></ol><p><strong data-i18n="debrief.transfer"></strong></p></div></div>
  <p><button id="closeRoomBtn" class="btn primary" type="button" data-i18n="debrief.close"></button></p>

<section id="closed" class="section">
  <div class="hero"><div class="kicker" data-i18n="closed.kicker"></div><h2 data-i18n="closed.title"></h2><p data-i18n="closed.note"></p></div>
  <div class="card"><h3 data-i18n="closed.ledger"></h3><div id="closedLedger" class="ledger"></div></div>
  <p><button id="startNewSessionBtn" class="btn" type="button" data-i18n="closed.newSession"></button></p>
</section>

<p class="footer"><span data-i18n="common.noBackend"></span> <span data-i18n="common.syntheticDeck"></span></p>
</main>
<script>// Shared pure rules. Bundled into each offline HTML with no runtime dependency.
const APP=Object.freeze({version:"3.0.0-local",ruleset:"STANDARD",deck:"synthetic-v1",rounds:7,lotsPerRound:10,bidIncrementCents:5000000});
const PHASES=["setup","practice","planning","auction","build","submit","debrief","closed"];
const MISSION_ARTWORK=Object.freeze({COMBAT:'combat',RECCE:'recce',TROOP:'troop-carrier',COMMAND:'command-post',RECOVERY:'recovery',MINE:'mine-clearing'});
function artworkAssetPath(id){if(id==='TRAIN-CAP')return 'practice/TRAIN-CAP.webp';if(Object.values(MISSION_ARTWORK).includes(id))return 'vehicles/'+id+'.webp';if(CARD_INDEX.has(id))return 'cards/'+id+'.webp';return null}
const MAX_SAFE_CENTS=BigInt(Number.MAX_SAFE_INTEGER);
const BACKUP_FORMAT="SEA-GAME-BACKUP",BACKUP_VERSION=1,MAX_BACKUP_CHARS=500000;
function makeBackup(role,state){must(["INSTRUCTOR","STUDENT"].includes(role)&&state&&state.schema===3);const session=parseSessionCode(state.sessionCode);return JSON.stringify({format:BACKUP_FORMAT,version:BACKUP_VERSION,appVersion:APP.version,ruleset:APP.ruleset,deck:APP.deck,schema:state.schema,sessionCode:session.code,role,state})}
function parseBackup(raw,role,validate,maxChars=MAX_BACKUP_CHARS){
 must(typeof raw==="string"&&raw.length<=maxChars&&["INSTRUCTOR","STUDENT"].includes(role)&&typeof validate==="function");
 const doc=JSON.parse(raw);must(doc&&typeof doc==="object"&&!Array.isArray(doc));
 const keys=Object.keys(doc).sort();must(keys.length===9&&keys.join(",")==="appVersion,deck,format,role,ruleset,schema,sessionCode,state,version");
 must(doc.format===BACKUP_FORMAT&&doc.version===BACKUP_VERSION&&typeof doc.appVersion==="string"&&doc.appVersion.length<=40&&doc.ruleset===APP.ruleset&&doc.deck===APP.deck&&doc.schema===3&&doc.role===role);
 must(doc.state&&typeof doc.state==="object"&&!Array.isArray(doc.state)&&doc.state.schema===doc.schema&&doc.state.sessionCode===doc.sessionCode);
 const normalized=validate(doc.state);must(normalized.schema===doc.schema&&normalized.sessionCode===doc.sessionCode);return normalized;
}
function validCents(n){return Number.isSafeInteger(n)&&n>=0}
function parseAmount(raw){
 const s=String(raw??"").trim();if(s.length>20)throw new Error("money");
 const m=/^(\d+)(?:[.,](\d{1,2}))?$/.exec(s);if(!m)throw new Error("money");
 const n=BigInt(m[1])*100n+BigInt((m[2]||"").padEnd(2,"0"));if(n>MAX_SAFE_CENTS)throw new Error("money");return Number(n);
}
function parseWholeDollars(raw){const s=String(raw??"").trim();if(s.length>17||!/^\d+$/.test(s))throw new Error("money");const c=BigInt(s)*100n;if(c>MAX_SAFE_CENTS)throw new Error("money");return Number(c)}
function parsePercentBps(raw){const s=String(raw??"").trim(),m=/^(\d+)(?:[.,](\d{1,2}))?$/.exec(s);if(s.length>10||!m)throw new Error("percent");const b=BigInt(m[1])*100n+BigInt((m[2]||"").padEnd(2,"0"));if(b>1000000n)throw new Error("percent");return b}
function addCents(a,b){if(!validCents(a)||!validCents(b))throw new Error("money");const z=BigInt(a)+BigInt(b);if(z>MAX_SAFE_CENTS)throw new Error("money");return Number(z)}
function profitFromBps(costCents,bps){if(!validCents(costCents))throw new Error("money");const b=BigInt(bps);if(b<0n||b>1000000n)throw new Error("percent");const p=(BigInt(costCents)*b+5000n)/10000n;if(p>MAX_SAFE_CENTS)throw new Error("money");return Number(p)}
const SLOT_ORDER=["CAPACITY","MOBILITY","FIREPOWER","PROTECTION","COMMS","SA","ACCESSORIES","SE_PROCESS","SE_PROCESS","SE_PROCESS"];
const LABELS={CAP:{en:["Capacity","persons"],fr:["Capacité","personnes"]},MOB:{en:["Mobility","km/h"],fr:["Mobilité","km/h"]},FP:{en:["Firepower","points"],fr:["Puissance de feu","points"]},PRO:{en:["Protection","points"],fr:["Protection","points"]},COM:{en:["Communications","km"],fr:["Communications","km"]},SA:{en:["Situational awareness","ways"],fr:["Connaissance de la situation","moyens"]},REC:{en:["Recovery","ways"],fr:["Dépannage","moyens"]},MC:{en:["Mine clearing","ways"],fr:["Déminage","moyens"]}};
const MISSIONS={COMBAT:{en:"Combat",fr:"Combat",req:{CAP:4,MOB:80,FP:10,PRO:10,COM:25,SA:1}},RECCE:{en:"RECCE",fr:"Reconnaissance",req:{CAP:3,MOB:120,FP:4,PRO:2,COM:75,SA:5}},TROOP:{en:"Troop Carrier",fr:"Transport de troupes",req:{CAP:10,MOB:100,FP:2,PRO:4,COM:25,SA:2}},COMMAND:{en:"Command Post",fr:"Poste de commandement",req:{CAP:5,MOB:60,FP:2,PRO:4,COM:125,SA:4}},RECOVERY:{en:"Recovery",fr:"Dépannage",req:{CAP:3,MOB:80,FP:4,PRO:6,COM:75,SA:2,REC:3}},MINE:{en:"Mine Clearing",fr:"Déminage",req:{CAP:4,MOB:40,FP:8,PRO:10,COM:25,SA:1,MC:3}}};
const POOLS={
CAPACITY:[["CAP-A",["Modular Crew Hull","Coque modulaire pour équipage"],300000,{CAP:6,MOB:-10}],["CAP-B",["Extended Carrier Module","Module de transport agrandi"],450000,{CAP:6}],["CAP-C",["Compact Passenger Bay","Compartiment compact pour passagers"],250000,{CAP:4,PRO:-1}],["CAP-D",["High-Capacity Hull","Coque à grande capacité"],550000,{CAP:8,MOB:-20}],["CAP-E",["Crew Compartment Insert","Insert de compartiment équipage"],350000,{CAP:5}],["CAP-F",["Protected Personnel Module","Module protégé pour personnel"],650000,{CAP:5,PRO:2}],["CAP-G",["Light Utility Hull","Coque utilitaire légère"],400000,{CAP:4,MOB:10}]],
MOBILITY:[["MOB-A",["Efficient Power Pack","Groupe motopropulseur efficace"],400000,{MOB:70}],["MOB-B",["High-Torque Drivetrain","Groupe de transmission à couple élevé"],550000,{MOB:80}],["MOB-C",["Lightweight Running Gear","Train de roulement léger"],350000,{MOB:60}],["MOB-D",["Heavy-Duty Suspension","Suspension renforcée"],500000,{MOB:50,PRO:1}],["MOB-E",["Long-Range Propulsion","Propulsion à longue portée"],600000,{MOB:90}],["MOB-F",["Compact Engine Set","Groupe moteur compact"],300000,{MOB:50}],["MOB-G",["Adaptive Traction Package","Ensemble de traction adaptative"],450000,{MOB:65}]],
FIREPOWER:[["FP-A",["Defensive Weapon Station","Poste d’arme défensif"],350000,{FP:2}],["FP-B",["Medium Weapon Station","Poste d’arme moyen"],500000,{FP:4}],["FP-C",["Heavy Weapon Station","Poste d’arme lourd"],700000,{FP:6,MOB:-10}],["FP-D",["Remote Defensive Mount","Affût défensif téléopéré"],600000,{FP:3,SA:1}],["FP-E",["Light Weapon Mount","Affût léger"],250000,{FP:2}],["FP-F",["Stabilized Weapon Suite","Ensemble d’arme stabilisée"],650000,{FP:5}],["FP-G",["Dual-Purpose Mount","Affût polyvalent"],550000,{FP:4,PRO:-1}]],

function choicesEditable(){return !state.vehiclesLocked&&["setup","planning"].includes(state.phase)&&state.teams.every(tm=>tm.purchases.length===0)}
function setTeamVehicle(id,mission){

}
function allChosen(){return state.teams.length===state.teamCount&&state.teams.every(tm=>validMission(tm.mission))}
function startScoredAuction(){

function validateInstructorSave(x){
 const cfg=validateBase(x);must(hasOnlyKeys(x,['schema','phase','lang','vehiclesLocked','sessionCode','marketSeed','market','teams','teamCount','revealMode','timingMode','bidSeconds','round','lot','revealed','open','pausedRemaining','deadline','leader','currentBid','ledger','seq','practice','privateEntry','resultDraft','finalCallAnnounced']));
 must(x.finalCallAnnounced===undefined||typeof x.finalCallAnnounced==='boolean');
 if(x.resultDraft!==undefined&&x.resultDraft!==null)must(hasOnlyKeys(x.resultDraft,['team','price','reason'])&&Object.keys(x.resultDraft).length===3&&typeof x.resultDraft.team==='string'&&x.resultDraft.team.length<=10&&typeof x.resultDraft.price==='string'&&x.resultDraft.price.length<=20&&typeof x.resultDraft.reason==='string'&&x.resultDraft.reason.length<=120);
 must(typeof x.vehiclesLocked==="boolean"&&Array.isArray(x.teams)&&x.teams.length===cfg.teamCount);
 must(["ROUND","JIT","MANUAL"].includes(x.revealMode)&&["TIMED","UNTIMED"].includes(x.timingMode)&&Number.isInteger(x.bidSeconds)&&x.bidSeconds>=10&&x.bidSeconds<=120);
 must(typeof x.marketSeed==="string"&&/^[A-F0-9]{32}$/.test(x.marketSeed));
 const expected=marketFromSeed(x.marketSeed);must(JSON.stringify(x.market)===JSON.stringify(expected));
 must(typeof x.open==="boolean"&&typeof x.revealed==="boolean"&&Array.isArray(x.ledger)&&x.ledger.length<=210&&x.seq===x.ledger.length);
 const rebuilt=x.teams.map((tm,i)=>{must(tm.id===i+1);return cleanTeam({...tm,purchases:[]},!x.vehiclesLocked)});
 if(x.vehiclesLocked){must(!["setup","practice","planning"].includes(x.phase));rebuilt.forEach(tm=>must(tm.mission===tm.lockedMission&&validMission(tm.mission)))}else{must(["setup","practice","planning"].includes(x.phase)&&x.ledger.length===0);rebuilt.forEach(tm=>must(tm.lockedMission===null))}
 const active=new Map();
 x.ledger.forEach((e,i)=>{
  must(e&&["SALE","UNSOLD","VOID"].includes(e.kind));const allowedEntry=e.kind==="VOID"?['seq','kind','round','lot','card','team','price','ref','reason']:e.kind==="SALE"?['seq','kind','round','lot','card','team','price','reason']:['seq','kind','round','lot','card','team','price'];must(hasOnlyKeys(e,allowedEntry)&&e.seq===i+1);if(e.kind==="SALE"&&e.reason!==undefined)must(typeof e.reason==='string'&&e.reason.trim().length>0&&e.reason.length<=120);const c=cardAt(e.card,e.round,e.lot);must(expected[e.round-1][e.lot-1].id===c.id);
  const k=e.round+'-'+e.lot,prior=active.get(k);
  if(e.kind==="VOID"){must(prior&&e.ref===prior.seq&&e.team===prior.team&&e.price===prior.price&&typeof e.reason==="string"&&e.reason.trim().length>0&&e.reason.length<=120);active.delete(k)}
  else{must(!prior);if(e.kind==="SALE"){must(Number.isInteger(e.team)&&e.team>=1&&e.team<=cfg.teamCount&&validCents(e.price)&&e.price>=c.start&&(e.price-c.start)%APP.bidIncrementCents===0)}else must(e.team===null&&e.price===null);active.set(k,e)}
 });
 for(const e of active.values())if(e.kind==="SALE")acquire(rebuilt[e.team-1],expected[e.round-1][e.lot-1],e.price);
 x.teams.forEach((tm,i)=>{const normalized=cleanTeam(tm,!x.vehiclesLocked);must(JSON.stringify(normalized.purchases)===JSON.stringify(rebuilt[i].purchases))});
 const position=x.round*10+x.lot;
 for(let i=0;i<position;i++)if(x.phase==="auction"||["build","submit","debrief","closed"].includes(x.phase))must(active.has((Math.floor(i/10)+1)+'-'+(i%10+1)));
 if(["build","submit","debrief","closed"].includes(x.phase))must(active.size===70);
 if(x.phase==="auction")for(const e of active.values())must((e.round-1)*10+e.lot-1<=position);
 if(x.leader!==null){must(Number.isInteger(x.leader)&&x.leader>=1&&x.leader<=cfg.teamCount&&validCents(x.currentBid));const c=expected[x.round][x.lot];must(x.currentBid>=c.start&&(x.currentBid-c.start)%APP.bidIncrementCents===0)}else must(x.currentBid===null);
 if(x.phase==="auction"&&!x.open){const e=active.get((x.round+1)+'-'+(x.lot+1));if(e?.kind==="SALE")must(x.leader===e.team&&x.currentBid===e.price);else must(x.leader===null&&x.currentBid===null)}
 if(x.open){must(x.phase==="auction"&&x.revealed&&!active.has((x.round+1)+'-'+(x.lot+1)));if(x.timingMode==="TIMED")must(Number.isFinite(x.deadline));must(x.pausedRemaining===null||(Number.isFinite(x.pausedRemaining)&&x.pausedRemaining>=0))}
 must(hasOnlyKeys(x.practice,['revealed','open','leader','closed'])&&['revealed','open','leader','closed'].every(k=>typeof x.practice[k]==="boolean"));
 const practice=x.practice;
 if(practice.open)must(practice.revealed&&!practice.closed);
 if(practice.leader)must(practice.revealed&&(practice.open||practice.closed));
 if(practice.closed)must(practice.revealed&&practice.leader&&!practice.open);
 if(x.phase!=="practice")must(!practice.revealed&&!practice.open&&!practice.leader&&!practice.closed);
 return {...x,teams:rebuilt,market:expected,privateEntry:false,resultDraft:x.resultDraft??null};
}

 const moved=state.phase!==p;state.phase=p;state.privateEntry=false;$$('.section').forEach(x=>x.classList.toggle('active',x.id===p));$('#phaseBadge').textContent=t('phase.'+p);if(moved){window.scrollTo(0,0);const h=document.querySelector('#'+p+' h2');if(h){h.tabIndex=-1;h.focus({preventScroll:true})}}saveState();return true;

function commitBackupImport(token){
 const pending=pendingBackupImport;if(!pending||pending.token!==token)return false;
 if(!seaConfirmGate('backup-import-'+token,t('backup.confirmInstructor'),()=>commitBackupImport(token)))return false;
 if(JSON.stringify(state)!==pending.before){pendingBackupImport=null;backupStatus('backup.changed');return false}
 if(state.sessionCode){
  const previous=makeBackup('INSTRUCTOR',{...state,privateEntry:false});
  try{sessionStorage.setItem(STORE_KEY+'_PRE_IMPORT',previous)}catch{}
  try{saveBackupDownload(previous,'pre-import')}catch{pendingBackupImport=null;backupStatus('backup.failed');return false}
 }else if(recoveryBlocked){
  try{const raw=sessionStorage.getItem(STORE_KEY);if(raw){const rescue=JSON.stringify({format:'SEA-GAME-RECOVERY-RESCUE',version:1,role:'INSTRUCTOR',raw});try{sessionStorage.setItem(STORE_KEY+'_PRE_IMPORT_RAW',rescue)}catch{}saveBackupDownload(rescue,'recovery-pre-import')}}catch{pendingBackupImport=null;backupStatus('backup.failed');return false}
 }
 stopTimer();state=pending.candidate;pendingBackupImport=null;lang=state.lang;recoveryBlocked=false;storageFailed=false;

}
async function readBackupFile(file){

 if(file.size>500000)return backupStatus('backup.tooLarge');

  const raw=await file.text();if(token!==backupImportGeneration)return;
  if(state!==original||JSON.stringify(state)!==before)return backupStatus('backup.changed');

  pendingBackupImport={token,candidate,before};

 }catch{if(token===backupImportGeneration)backupStatus('backup.invalid')}
}

}
function renderAssignments(target){
 const editing=choicesEditable(),prefix=target.id,session=state.sessionCode;
 target.innerHTML=state.teams.map(tm=>`<div class="inv"><label for="${prefix}-${tm.id}"><strong>${esc(t('common.team',{n:tm.id}))}</strong> · ${esc(t('vehicle.label'))}</label><div class="field"><select id="${prefix}-${tm.id}" data-vehicle-team="${tm.id}" ${editing?'':'disabled'}>${vehicleOptions(tm.mission)}</select></div>${validMission(tm.mission)?`<details><summary>${esc(MISSIONS[tm.mission][lang])}</summary>${vehiclePreview(tm.mission)}</details>`:''}</div>`).join('');
 target.querySelectorAll('[data-vehicle-team]').forEach(el=>{const tm=state.teams.find(team=>team.id===Number(el.dataset.vehicleTeam));el.onchange=()=>{if(!el.isConnected||state.sessionCode!==session||!tm||!state.teams.includes(tm))return false;return setTeamVehicle(tm.id,el.value)}});
 const count=state.teams.filter(tm=>validMission(tm.mission)).length;
 const status=document.getElementById(prefix==='assignmentList'?'setupVehicleStatus':'planningVehicleStatus');if(status)status.textContent=t('vehicle.ready',{count,total:state.teamCount});
}
function generateSession(){
 if(state.phase!=='setup'||recoveryBlocked)return false;
 const controls=['#teamCount','#bidSeconds','#revealMode','#timingMode'],choices=controls.map(id=>$(id).value),original=state,before=JSON.stringify(state);
 const n=Number(choices[0]),seconds=Number(choices[1]),reveal=choices[2],timing=choices[3];
 if(!Number.isInteger(n)||n<2||n>10||!Number.isInteger(seconds)||seconds<10||seconds>120||!['ROUND','JIT','MANUAL'].includes(reveal)||!['TIMED','UNTIMED'].includes(timing)){seaNotify(t('errors.state'));return false}
 const apply=()=>{
  if(state!==original||JSON.stringify(state)!==before||recoveryBlocked||controls.some((id,i)=>$(id).value!==choices[i])){seaNotify(t('errors.changed'));return false}
  stopTimer();state.teamCount=n;state.revealMode=reveal;state.timingMode=timing;state.bidSeconds=seconds;
  state.sessionCode=sessionCode(n);state.marketSeed=randomHex(16);state.market=marketFromSeed(state.marketSeed);state.teams=createTeams(state.sessionCode);
  state.vehiclesLocked=false;state.round=0;state.lot=0;state.revealed=state.revealMode!=='MANUAL';state.open=false;state.pausedRemaining=null;state.deadline=null;state.leader=null;state.currentBid=null;state.ledger=[];state.seq=0;state.resultDraft=null;
  $('#setupStatus').textContent=t('setup.ready');saveState();renderAll();return true;
 };
 if(state.sessionCode&&state.teams.some(tm=>tm.mission)&&!seaConfirmGate('session-reset',t('common.confirmCorrection'),apply))return false;
 return apply();
}

function renderPractice(){
 const p=state.practice,stage=p.closed?'done':p.leader?'bid':p.open?'open':p.revealed?'revealed':'ready';
 $('#practiceStatus').textContent=t('practice.stage.'+stage);$('#toPlanning').disabled=!p.closed;
 $('#practiceReveal').disabled=p.revealed;$('#practiceOpen').disabled=!p.revealed||p.open||p.closed;$('#practiceAccept').disabled=!p.open||p.leader||p.closed;$('#practiceClose').disabled=!p.open||!p.leader||p.closed;
 $('#practice .gamecard').classList.toggle('hidden',!p.revealed);if(p.revealed){const artEl=$('#practiceArt');if(artEl&&!artEl.firstChild)artEl.innerHTML=art({id:'TRAIN-CAP',title:{en:'Training capacity',fr:'Capacité de formation'}})}saveState();
}
function resetPractice(){if(!['setup','practice'].includes(state.phase))return false;state.practice={revealed:false,open:false,leader:false,closed:false};renderPractice();return true}

function renderPlanning(){
 renderAssignments($('#planningTeams'));$('#startAuctionBtn').disabled=!allChosen()||state.vehiclesLocked;
 const counts=MISSION_IDS.map(id=>`${MISSIONS[id][lang]}: ${state.teams.filter(tm=>tm.mission===id).length}`).join(' · ');
 $('#vehicleMix').textContent=counts+'\n'+t('vehicle.mix');
}
function renderMarket(){const row=state.market[state.round];$("#market").innerHTML=row.map((c,i)=>{const vis=visibleLot(i);return`<div class="market-card ${i===state.lot?"current":""} ${vis?"":"hiddenlot"}"><div class="slot">${t("common.lot",{n:i+1})}</div><strong>${vis?esc(c.title[lang]):t("common.hidden")}</strong><div>${vis?money(c.start):"-"}</div></div>`}).join("");
 // Committed earlier rounds remain public in every reveal mode, including JIT.
 // The validated ledger guarantees that all prior-round lots were committed.
 const history=state.market.slice(0,state.round).flatMap((past,r)=>past.map((c,i)=>`<details class="market-card" data-history-r="${r}" data-history-l="${i}"><summary>${t("common.round",{n:r+1})} / ${t("common.lot",{n:i+1})}: ${esc(c.title[lang])} - ${money(c.start)}</summary><div class="history-detail"></div></details>`));
 let archive=document.getElementById("publicLotHistory");
 if(!history.length){if(archive)archive.remove();return}
 if(!archive){archive=document.createElement("details");archive.id="publicLotHistory";archive.className="card";$("#market").insertAdjacentElement("afterend",archive)}
 const expanded=archive.open;
 const opened=[...archive.querySelectorAll("details[open][data-history-r]")].map(d=>d.dataset.historyR+"-"+d.dataset.historyL);
 const label=lang==="fr"?"Lots précédemment révélés":"Previously revealed lots";
 archive.innerHTML=`<summary>${label} (${history.length})</summary><div class="market">${history.join("")}</div>`;
 archive.open=expanded;
 archive.querySelectorAll("[data-history-r]").forEach(d=>{
  d.ontoggle=()=>{if(!d.open)return;const c=state.market[Number(d.dataset.historyR)][Number(d.dataset.historyL)];d.querySelector(".history-detail").innerHTML=`<div class="art" style="height:180px">${art(c)}</div><div>${effectsHtml(c)}</div>`};
  if(opened.includes(d.dataset.historyR+"-"+d.dataset.historyL))d.open=true;
 });
}
function renderCurrentCard(){const c=currentCard(),vis=visibleLot(state.lot);$("#cardCat").textContent=vis?categoryName(c.cat):"-";$("#cardId").textContent=vis?c.id:"-";$("#cardTitle").textContent=vis?c.title[lang]:t("common.hidden");$("#cardEffects").innerHTML=vis?effectsHtml(c):"";$("#cardArt").innerHTML=vis?art(c):`<div style="height:100%;display:grid;place-items:center">${t("common.hidden")}</div>`;$("#startPrice").textContent=vis?t("common.starting",{amount:money(c.start)}):"";$("#leaderText").textContent=state.leader?t("common.team",{n:state.leader})+" · "+money(state.currentBid):t("common.noLeader")}

function acceptTeamBid(id,intended){
 if(!biddingActive())return false;const tm=state.teams.find(x=>x.id===id),amount=nextOffer();
 if(!tm||!validMission(tm.mission)||!SEA_AUCTION.canWin(tm.purchasesByRound[state.round])||state.leader===id||amount===null)return false;
 if(intended!==amount){seaNotify(t('errors.stale'));return false}
 try{addCents(tm.cost,amount)}catch{seaNotify(t('errors.moneyRange'));return false}
 state.currentBid=amount;state.leader=id;state.resultDraft=null;renderAuction();return true;
}

function renderBidRoster(){
 const next=nextOffer();$('#bidRoster').innerHTML=state.teams.map(tm=>{const used=tm.purchasesByRound[state.round],left=2-used,leader=state.leader===tm.id,eligible=biddingActive()&&SEA_AUCTION.canWin(used)&&!leader&&next!==null;
 return `<div class="ledger-row bid-row"><strong>${t('common.team',{n:tm.id})}</strong><span class="bid-team-meta">${esc(MISSIONS[tm.mission][lang])}<small>${t('common.wins',{used,left})}</small></span><button class="btn ${leader?'good':'primary'}" data-bid-team="${tm.id}" data-bid-amount="${next??''}" ${eligible?'':'disabled'}>${leader?t('auction.leading',{amount:money(state.currentBid)}):t('auction.accept',{amount:next===null?'-':money(next)})}</button></div>`}).join('');
 $$('[data-bid-team]').forEach(b=>b.onclick=()=>acceptTeamBid(Number(b.dataset.bidTeam),Number(b.dataset.bidAmount)));
}

function renderCommitControls(){
 const vis=visibleLot(state.lot),amount=nextOffer(),entry=effectiveEntry(),draft=state.resultDraft||{team:state.leader,price:state.currentBid===null?'':amountInput(state.currentBid),reason:''};
 $('#leaderSummary').textContent=state.leader?t('common.team',{n:state.leader})+' · '+money(state.currentBid):'-';$('#nextBid').textContent=vis&&amount!==null?money(amount):'-';$('#timerValue').textContent=timerText();
 $('#pauseBtn').textContent=state.pausedRemaining===null?t('auction.pause'):t('auction.resume');$('#pauseBtn').disabled=!state.open||committed();$('#extendBtn').disabled=!state.open||state.timingMode!=='TIMED'||committed();
 $('#winnerSelect').innerHTML=`<option value="">${t('common.selectTeam')}</option>`+state.teams.map(tm=>`<option value="${tm.id}" ${Number(draft.team)===tm.id?'selected':''} ${!SEA_AUCTION.canWin(tm.purchasesByRound[state.round])?'disabled':''}>${t('common.team',{n:tm.id})}</option>`).join('');
 $('#finalPrice').value=draft.price;$('#saleCorrectionReason').value=draft.reason;
 const storeDraft=()=>{state.resultDraft={team:$('#winnerSelect').value,price:$('#finalPrice').value,reason:$('#saleCorrectionReason').value};saveState()};['winnerSelect','finalPrice','saleCorrectionReason'].forEach(id=>document.getElementById(id).oninput=storeDraft);
 $('#commitSummary').textContent=state.leader?t('auction.commitReady',{team:state.leader,amount:money(state.currentBid)}):t('auction.noAccepted');
 $('#commitStatus').textContent=entry?(entry.kind==='SALE'?t('auction.committed',{team:entry.team,amount:money(entry.price)}):t('auction.unsoldCommitted')):t('auction.notCommitted');
 $('#commitLeaderBtn').disabled=!liveClosing()||state.leader===null;$('#commitUnsoldBtn').disabled=!liveClosing();$('#commitCorrectedBtn').disabled=!liveClosing();$('#voidCurrentBtn').disabled=state.phase!=='auction'||!entry;$('#advanceBtn').disabled=!entry;
 $('#revealBtn').disabled=state.revealMode!=='MANUAL'||state.revealed||committed();$('#openBtn').disabled=state.open||committed();
}
function renderLedger(target=$("#ledger")){target.innerHTML=state.ledger.length?state.ledger.map(e=>`<div class="ledger-row"><span>${e.round}</span><span>${e.lot}</span><span>${esc(e.card)}</span><span>${e.kind==="VOID"?t("common.void"):e.kind==="UNSOLD"?t("common.unsold"):"T"+e.team}</span><span>${e.price?money(e.price):"-"}</span></div>`).join(""):`<div class="muted" style="padding:10px">${t("auction.noEntries")}</div>`}
function renderWorkflow(){const c=committed(),vis=visibleLot(state.lot);$("#workflow").innerHTML=[[t("auction.reveal"),vis],[t("auction.open"),state.open||c],[t("auction.acceptCaller"),!!state.leader||c],[t("auction.commitTitle"),c],[t("auction.advance"),false]].map((x,i)=>`<span class="${!x[1]&&((i===0&&!vis)||(i===1&&vis&&!state.open)||(i===2&&state.open)||(i===3&&state.open)||(i===4&&c))?"current":""}">${i+1}. ${esc(x[0].replace(/^\d+ · /,""))} ${x[1]?"✓":""}</span>`).join("")}
function renderAuction(){$("#auctionRule").textContent=t(state.revealMode==="ROUND"?"auction.rule.round":state.revealMode==="JIT"?"auction.rule.jit":"auction.rule.manual");$("#roundHeading").textContent=t("common.roundLot",{round:state.round+1,lot:state.lot+1});$("#lotBadge").textContent=state.open?t("common.open"):committed()?t("common.committed"):t("common.ready");renderMarket();renderCurrentCard();renderBidRoster();renderCommitControls();renderLedger();renderWorkflow();saveState()}

function commitSale(teamId,price,reason=''){
 if(!liveClosing())return false;const tm=state.teams.find(x=>x.id===teamId);if(!tm){seaNotify(t('errors.badTeam'));return false}
 const corrected=state.leader!==teamId||state.currentBid!==price;
 if(corrected&&(!reason.trim()||reason.length>120)){seaNotify(t('errors.reason'));return false}
 if(corrected&&!seaConfirmGate('sale-correction',t('common.confirmCorrection'),()=>commitSale(teamId,price,reason)))return false;
 try{acquire(tm,currentCard(),price)}catch{seaNotify(t('errors.moneyRange'));return false}
 const c=currentCard();state.leader=teamId;state.currentBid=price;state.open=false;state.pausedRemaining=null;state.resultDraft=null;stopTimer();
 appendLog({kind:'SALE',round:c.round,lot:c.lot,card:c.id,team:teamId,price,...(corrected?{reason}: {})});renderAuction();return true;
}
function commitCurrentLeader(){if(state.leader===null||state.currentBid===null)return;commitSale(state.leader,state.currentBid)}

function commitCorrected(){try{return commitSale(Number($('#winnerSelect').value),parseWholeDollars($('#finalPrice').value),$('#saleCorrectionReason').value.trim())}catch{seaNotify(t('errors.moneyRange'));return false}}

function commitUnsold(){
 if(!liveClosing())return false;if(state.leader!==null&&!seaConfirmGate('unsold-leader',t('auction.confirmUnsoldWithLeader'),()=>commitUnsold()))return false;
 const c=currentCard();state.open=false;state.pausedRemaining=null;state.leader=null;state.currentBid=null;state.resultDraft=null;stopTimer();appendLog({kind:'UNSOLD',round:c.round,lot:c.lot,card:c.id,team:null,price:null});renderAuction();return true;
}

function voidCurrent(){
 if(state.phase!=='auction')return false;const e=effectiveEntry();if(!e)return false;const reason=$('#correctionReason').value.trim();if(!reason||reason.length>120){seaNotify(t('errors.reason'));return false}if(!seaConfirmGate('void-lot',t('common.confirmCorrection'),()=>voidCurrent()))return false;
 if(e.kind==='SALE'){const tm=state.teams.find(x=>x.id===e.team),idx=tm.purchases.findIndex(p=>p.round===e.round&&p.lot===e.lot&&p.id===e.card&&p.paid===e.price);if(idx<0){seaNotify(t('errors.state'));return false}removePurchase(tm,idx)}
 state.open=false;state.pausedRemaining=null;state.leader=null;state.currentBid=null;state.resultDraft=null;stopTimer();appendLog({kind:'VOID',ref:e.seq,round:e.round,lot:e.lot,card:e.card,team:e.team,price:e.price,reason});$('#correctionReason').value='';renderAuction();return true;
}

function advance(){
 if(state.phase!=='auction'||!committed())return false;
 if(state.lot===9&&state.round===6){phase('build');renderAll();return true}
 if(state.lot<9)state.lot++;else{state.round++;state.lot=0}state.revealed=state.revealMode!=='MANUAL';state.open=false;state.leader=null;state.currentBid=null;state.resultDraft=null;renderAuction();return true;
}
function renderBuild(){$("#authoritativeBuild").innerHTML=state.teams.map(tm=>{const sf=shortfalls(tm),sc=score(tm);const plist=tm.purchases.length?tm.purchases.map(p=>`<div class="purchase-row"><span>R${p.round}·L${p.lot}</span><span>${esc(p.id)} - ${esc(p.title[lang])}</span><strong>${money(p.paid)}</strong></div>`).join(""):`<div class="muted">${t("build.noPurchases")}</div>`;return`<div class="card team-summary"><div class="space"><h3>${t("common.team",{n:tm.id})} - ${esc(MISSIONS[tm.mission][lang])}</h3><strong class="${compliant(tm)?"pass":"fail"}">${compliant(tm)?t("common.compliant"):t("common.noncompliant")} · ${t("common.score")} ${sc}</strong></div><div class="grid three"><div class="metric"><div class="label">${t("common.cost")}</div><div class="value">${money(tm.cost)}</div></div><div class="metric"><div class="label">${t("common.score")}</div><div class="value">${sc}</div></div><div class="metric"><div class="label">${t("build.purchases")}</div><div class="value">${tm.purchases.length}</div></div></div><div class="effects">${Object.entries(tm.totals).map(([k,v])=>`<div class="effect">${esc(LABELS[k][lang][0])}<strong>${v}</strong><small>${esc(LABELS[k][lang][1])}</small></div>`).join("")}</div>${sf.length?`<div class="notice bad">${t("build.shortfalls",{items:sf.map(([k,v])=>LABELS[k][lang][0]+" "+tm.totals[k]+"/"+v).join(", ")})}</div>`:`<div class="notice good">${t("build.allPass")}</div>`}<div class="purchase-list">${plist}</div></div>`}).join("");saveState()}

function openPrivateSubmissions(){
 if(state.phase!=='submit'||state.privateEntry)return false;
 const before=JSON.stringify(state);
 const apply=()=>{if(state.phase!=='submit'||JSON.stringify(state)!==before){seaNotify(t('errors.changed'));return false}state.privateEntry=true;renderSubmit();return true};
 if(!seaConfirmGate('private-submissions',t('submit.privateConfirm'),apply))return false;
 return apply();
}
function closeSubmissions(){
 if(state.phase!=='submit')return false;
 const before=JSON.stringify(state),pending=state.teams.filter(team=>!team.submitted).length;
 const apply=()=>{if(state.phase!=='submit'||JSON.stringify(state)!==before){seaNotify(t('errors.changed'));return false}if(!phase('debrief'))return false;renderAll();return true};
 if(pending&&!seaConfirmGate('close-submissions',t('submit.pendingConfirm',{count:pending}),apply))return false;
 return apply();
}
function renderSubmit(){
 const privateOn=state.phase==='submit'&&state.privateEntry===true,session=state.sessionCode;$('#privateSubmitGuard').classList.toggle('hidden',privateOn);
 $('#submissionRows').innerHTML=state.teams.map(tm=>`<div class="inv"><div class="space"><strong>${t('common.team',{n:tm.id})} - ${esc(MISSIONS[tm.mission][lang])}</strong><span>${tm.submitted?t('submit.submitted'):t('debrief.notSubmitted')}</span></div>${privateOn?`<div class="grid three"><div class="field"><label for="profit-${tm.id}">${t('submit.profitAmount')}</label><input id="profit-${tm.id}" data-profit-team="${tm.id}" inputmode="decimal" maxlength="20" value="${amountInput(tm.profit)}"></div><label class="check-label"><input type="checkbox" data-submitted-team="${tm.id}" ${tm.submitted?'checked':''}>${t('submit.submitted')}</label><div class="metric"><div class="label">${t('common.bid')}</div><div class="value">${money(addCents(tm.cost,tm.profit))}</div></div></div>`:''}</div>`).join('');
 $$('[data-profit-team]').forEach(e=>{const tm=state.teams.find(x=>x.id===Number(e.dataset.profitTeam));e.onchange=()=>{if(state.phase!=='submit'||!state.privateEntry||state.sessionCode!==session||!e.isConnected||!tm||!state.teams.includes(tm))return;try{const profit=parseAmount(e.value);addCents(tm.cost,profit);tm.profit=profit;saveState();renderSubmit()}catch{seaNotify(t('errors.moneyRange'));e.value=amountInput(tm.profit)}}});
 $$('[data-submitted-team]').forEach(e=>{const tm=state.teams.find(x=>x.id===Number(e.dataset.submittedTeam));e.onchange=()=>{if(state.phase!=='submit'||!state.privateEntry||state.sessionCode!==session||!e.isConnected||!tm||!state.teams.includes(tm))return;tm.submitted=e.checked;saveState()}});
}
function renderDebrief(){const eligible=state.teams.filter(awardEligible).sort(awardComparator);let head;if(!eligible.length)head=`<h3>${t("debrief.noAward")}</h3>`;else{const top=eligible[0],ties=eligible.filter(x=>exactTopTie(x,top));head=`<h3>${ties.length>1?t("debrief.shared",{teams:ties.map(x=>t("common.team",{n:x.id})).join(", ")}):t("debrief.award",{team:top.id})}</h3>`}const ranked=eligible.map((tm,i)=>{const bid=addCents(tm.cost,tm.profit),sc=score(tm);return`<div class="inv"><strong>${i+1}. ${t("common.team",{n:tm.id})}</strong><div>${money(bid)} · ${sc} ${t("common.points")} · ${ratioDisplay(bid,sc)}</div></div>`}).join("");const summaries=state.teams.map(tm=>{const sc=score(tm),bid=addCents(tm.cost,tm.profit),status=!tm.submitted?t("debrief.notSubmitted"):!compliant(tm)?t("common.noncompliant"):sc<=0?t("debrief.noRated"):t("common.compliant"),major=tm.purchases.slice().sort((a,b)=>b.paid-a.paid).slice(0,3).map(p=>`${esc(p.id)} ${money(p.paid)}`).join(" · ")||"-";return`<div class="inv"><div class="space"><strong>${t("common.team",{n:tm.id})} - ${esc(MISSIONS[tm.mission][lang])}</strong><span>${status}</span></div><div>${t("common.score")} ${sc} · ${t("common.cost")} ${money(tm.cost)} · ${t("common.profit")} ${money(tm.profit)} · ${t("common.bid")} ${money(bid)} · ${t("common.cpp")} ${ratioDisplay(bid,sc)}</div><small>${t("debrief.majorPurchases")}: ${major}</small></div>`}).join("");$("#ranking").innerHTML=head+ranked+`<h3 style="margin-top:16px">${t("debrief.teamSummaries")}</h3>`+summaries;saveState()}
function renderAll(){state.lang=lang;applyI18n();renderBackupControls();$("#phaseBadge").textContent=t("phase."+state.phase);$("#sessionBadge").textContent=state.sessionCode||"-";if(state.phase==="setup"&&!state.sessionCode)$("#setupStatus").textContent=t("setup.empty");if(state.phase==="setup"&&state.sessionCode){$("#setupStatus").textContent=t("setup.ready");$("#sessionCode .value").textContent=state.sessionCode;renderAssignments($("#assignmentList"));$("#startTutorialBtn").disabled=false}if(state.phase==="practice")renderPractice();if(state.phase==="planning")renderPlanning();if(state.phase==="auction")renderAuction();if(state.phase==="build")renderBuild();if(state.phase==="submit")renderSubmit();if(state.phase==="debrief")renderDebrief();if(state.phase==="closed")renderLedger($("#closedLedger"));if(recoveryBlocked)storageNotice("common.badRecovery");else if(storageFailed)storageNotice("common.refresh")}
$("#teamCount").innerHTML=Array.from({length:9},(_,i)=>`<option value="${i+2}" ${i===8?"selected":""}>${i+2}</option>`).join("");
$("#generateBtn").onclick=generateSession;
$("#startTutorialBtn").onclick=()=>{if(state.phase!=="setup"||!state.sessionCode)return;resetPractice();phase("practice");renderAll()};
$("#practiceReveal").onclick=()=>{if(state.phase!=="practice"||state.practice.revealed||state.practice.closed)return;state.practice.revealed=true;renderPractice()};
$("#practiceOpen").onclick=()=>{if(state.phase!=="practice"||!state.practice.revealed||state.practice.open||state.practice.closed)return;state.practice.open=true;renderPractice()};
$("#practiceAccept").onclick=()=>{if(state.phase!=="practice"||!state.practice.revealed||!state.practice.open||state.practice.leader||state.practice.closed)return;state.practice.leader=true;renderPractice()};
$("#practiceClose").onclick=()=>{if(state.phase!=="practice"||!state.practice.revealed||!state.practice.open||!state.practice.leader||state.practice.closed)return;state.practice.closed=true;state.practice.open=false;renderPractice()};
$("#practiceReset").onclick=()=>{if(state.phase!=="practice")return;resetPractice()};
$("#toPlanning").onclick=()=>{if(state.phase!=="practice"||!state.practice.closed)return;resetPractice();phase("planning");renderAll()};
$("#startAuctionBtn").onclick=startScoredAuction;
$("#revealBtn").onclick=()=>{if(state.phase!=="auction"||committed())return;state.revealed=true;renderAuction()};
$("#openBtn").onclick=openAuction;
$("#pauseBtn").onclick=togglePause;
$("#extendBtn").onclick=extendAuction;
$("#commitLeaderBtn").onclick=commitCurrentLeader;
$("#commitUnsoldBtn").onclick=commitUnsold;
$("#commitCorrectedBtn").onclick=commitCorrected;
$("#voidCurrentBtn").onclick=voidCurrent;
$("#advanceBtn").onclick=advance;
$("#openSubmissionsBtn").onclick=()=>{if(state.phase!=="build")return;phase("submit");renderAll()};
$("#privateSubmitBtn").onclick=openPrivateSubmissions;
$("#closeSubmissionsBtn").onclick=closeSubmissions;
$("#closeRoomBtn").onclick=()=>{if(state.phase!=="debrief")return;phase("closed");renderAll()};


$('#exportBackupBtn').onclick=exportBackup;
$('#importBackupBtn').onclick=()=>$('#backupFile').click();
$('#restorePreviousBtn').onclick=restorePreviousBackup;
$('#startNewSessionBtn').onclick=startNewSession;
$('#backupFile').onchange=e=>{const file=e.target.files?.[0];e.target.value='';readBackupFile(file)};
$("#langBtn").onclick=()=>{lang=lang==="en"?"fr":"en";renderAll();saveState()};
if(!safeSessionStorage())$("#recoveryStatus").textContent=t("setup.noStorage");
bindArtworkEvents();
if(restoreState()){$("#teamCount").value=String(state.teamCount);$("#revealMode").value=state.revealMode;$("#timingMode").value=state.timingMode;$("#bidSeconds").value=String(state.bidSeconds);$("#recoveryStatus").className="notice good";$("#recoveryStatus").textContent=t("setup.recovered");phase(state.phase)}else phase("setup");
renderAll();
</script>
</body></html>
