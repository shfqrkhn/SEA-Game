<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#252a27">
<title>Systems Engineering Awareness</title>
<style>
:root{
  color-scheme:light;
  --canvas:#f4f2ed;
  --surface:#fffdf8;
  --surface-2:#ece9e1;
  --surface-3:#dedbd2;
  --ink:#1f2320;
  --muted:#5f665f;
  --line:#cbc7bd;
  --line-strong:#8f958f;
  --charcoal:#252a27;
  --slate:#3f4a45;
  --blue:#3f647a;
  --olive:#5e6f58;
  --amber:#a75f24;
  --green:#416745;
  --red:#8a3f3b;
  --focus:#0b57d0;
  --shadow:0 1px 2px rgba(22,27,23,.08);
  --r-sm:4px;
  --r-md:6px;
  --s1:4px;
  --s2:8px;
  --s3:12px;
  --s4:16px;
  --s5:24px;
  --s6:32px;
}
*{box-sizing:border-box}
html{scroll-padding-top:88px}
body{
  margin:0;
  background:var(--canvas);
  color:var(--ink);
  font-family:"Segoe UI",system-ui,-apple-system,BlinkMacSystemFont,Arial,sans-serif;
  font-size:16px;
  line-height:1.45;
  text-rendering:optimizeLegibility;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{color:var(--blue)}
.hidden{display:none!important}
.skip-link{
  position:fixed;left:8px;top:8px;z-index:1000;
  transform:translateY(-160%);
  background:#fff;color:#111;border:2px solid var(--focus);
  padding:8px 12px;border-radius:var(--r-sm);
}
.skip-link:focus{transform:none}

header{
  position:sticky;top:0;z-index:20;
  display:flex;justify-content:space-between;align-items:center;gap:var(--s4);
  min-height:64px;padding:10px 20px;
  background:var(--charcoal);color:#fff;
  border-bottom:1px solid #101311;
}
.brand{display:flex;gap:12px;align-items:center;min-width:0}
.mark{
  width:32px;height:32px;display:grid;place-items:center;
  background:#fff;color:var(--charcoal);
  border-radius:var(--r-sm);font-weight:700;letter-spacing:.02em;
  flex:0 0 auto;
}
.brand h1{font-size:16px;line-height:20px;font-weight:650;margin:0}
.brand small{display:block;color:#cfd5d0;font-size:12px;margin-top:2px}
.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.status{
  display:flex;gap:8px;align-items:center;flex-wrap:wrap;
  min-height:40px;padding:6px 20px;
  background:#e8e6df;color:var(--ink);
  border-bottom:1px solid var(--line);
}
.badge{
  display:inline-flex;align-items:center;min-height:28px;
  border:1px solid var(--line-strong);border-radius:var(--r-sm);
  padding:3px 8px;background:transparent;color:var(--ink);
  font-size:12px;font-weight:600;
}

main{max-width:1180px;margin:0 auto;padding:var(--s6) 24px 48px}
.section{display:none}
.section.active{display:block}
.section>*+*{margin-top:var(--s4)}
.hero{max-width:920px;margin-bottom:var(--s5)}
.hero h2{
  margin:4px 0 8px;
  font-size:clamp(28px,4vw,40px);
  line-height:1.1;letter-spacing:-.025em;font-weight:680;
}
.hero p{margin:0;color:var(--muted);max-width:78ch}
.kicker{
  color:var(--amber);
  font-size:13px;line-height:18px;font-weight:650;
  letter-spacing:0;text-transform:none;
}

.grid{display:grid;gap:var(--s4)}
.section>.grid,.auction{align-items:start}
.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.auction{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(320px,.8fr);gap:var(--s4)}
.auction>*,.grid>*,.card,.gamecard{min-width:0}

.card{
  background:var(--surface);color:var(--ink);
  border:1px solid var(--line);border-radius:var(--r-md);
  padding:var(--s4);box-shadow:var(--shadow);
}
.card.subtle{background:var(--surface-2);box-shadow:none}
.card h3,.card h4{margin-top:0}
.card h3{font-size:18px;line-height:24px;font-weight:650;margin-bottom:12px}
.card h4{font-size:15px;line-height:20px;font-weight:650;margin-bottom:8px}

.field{display:grid;gap:6px;margin-bottom:var(--s3)}
.field label{font-weight:600;font-size:14px}
.field input,.field select,.field textarea{
  width:100%;min-height:44px;padding:9px 10px;
  border:1px solid #949991;border-radius:var(--r-sm);
  background:#fff;color:var(--ink);
}
.field textarea{min-height:88px;resize:vertical}
.field input:hover,.field select:hover,.field textarea:hover{border-color:#626862}

.btn{
  min-height:44px;padding:8px 14px;
  border:1px solid #838a83;border-radius:var(--r-sm);
  background:#fff;color:var(--ink);
  font-weight:600;line-height:1.2;
  box-shadow:none;
}
.btn:hover:not(:disabled){background:#f1efe9}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover:not(:disabled){background:#34586c}
.btn.secondary{background:var(--slate);border-color:var(--slate);color:#fff}
.btn.secondary:hover:not(:disabled){background:#333e39}
.btn.good{background:var(--green);border-color:var(--green);color:#fff}
.btn.good:hover:not(:disabled){background:#365a3a}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn.danger:hover:not(:disabled){background:#763632}
.btn.ghost{background:transparent;color:#fff;border-color:#727a74}
.btn.ghost:hover:not(:disabled){background:#333a35}
.btn:disabled{opacity:.46;cursor:not-allowed}

button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,a:focus-visible{
  outline:3px solid var(--focus);
  outline-offset:2px;
}
summary{cursor:pointer;border-radius:var(--r-sm)}
details{border-top:1px solid var(--line);padding-top:var(--s3);margin-top:var(--s3)}
details[open] summary{margin-bottom:var(--s3)}

.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.space{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.muted{color:var(--muted)}

.notice{
  padding:10px 12px;
  border:1px solid #d5b98d;border-left:4px solid var(--amber);
  border-radius:var(--r-sm);background:#f7efe3;color:#3c3025;
}
.notice.info{border-color:#9fb6c4;border-left-color:var(--blue);background:#eaf0f3;color:#263943}
.notice.good{border-color:#a7bea8;border-left-color:var(--green);background:#ebf1e9;color:#29402b}
.notice.bad{border-color:#d1a7a3;border-left-color:var(--red);background:#f5e9e7;color:#512e2b}

.metric{
  min-width:0;border-top:2px solid var(--line-strong);
  padding:10px 0 4px;background:transparent;
}
.metric .label{
  font-size:12px;line-height:16px;font-weight:600;
  color:var(--muted);text-transform:none;letter-spacing:0;
}
.metric .value{
  margin-top:3px;font-size:21px;line-height:26px;font-weight:680;
  font-variant-numeric:tabular-nums;
  overflow-wrap:anywhere;
}

.market{
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;
}
.market-card{
  min-width:0;border:1px solid var(--line);
  background:var(--surface);border-radius:var(--r-sm);padding:10px;
}
.market-card.current{
  border-color:var(--amber);
  box-shadow:inset 0 0 0 2px var(--amber);
  outline:0;
}
.market-card.hiddenlot{background:var(--surface-2);color:#6b6d69}
.slot{font-size:12px;line-height:16px;font-weight:650;color:var(--muted);text-transform:none;letter-spacing:0}

.gamecard{
  background:var(--surface);color:var(--ink);
  border:1px solid #8d938d;border-radius:var(--r-md);overflow:hidden;
  box-shadow:var(--shadow);
}
.gamecard .band{
  display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;
  padding:8px 12px;background:var(--slate);color:#fff;
  font-size:13px;font-weight:600;
}
.gamecard .body{padding:var(--s4)}
.art{
  height:156px;border:1px solid var(--line);border-radius:var(--r-sm);
  overflow:hidden;background:#f0ede5;
}
.art svg{width:100%;height:100%;display:block}

.effects{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
  gap:8px;margin:12px 0;
}
.effect{
  min-width:0;border:1px solid var(--line);border-radius:var(--r-sm);
  padding:8px;text-align:left;background:#faf8f2;color:var(--ink);
}
.effect strong{display:block;font-size:18px;line-height:22px;font-weight:680;font-variant-numeric:tabular-nums}
.effect small{color:var(--muted)}
.price{font-size:28px;line-height:34px;font-weight:680;font-variant-numeric:tabular-nums}

.team-buttons{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:8px;
}
.ledger{
  min-width:0;max-width:100%;max-height:380px;overflow:auto;
  border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);
}
.ledger-row{
  display:grid;grid-template-columns:44px 44px minmax(0,1fr) 90px 110px;
  gap:8px;align-items:center;padding:9px 10px;
  border-bottom:1px solid #e2dfd7;font-size:13px;
}
.ledger-row:last-child{border-bottom:0}
.bid-row{grid-template-columns:64px minmax(0,1fr) minmax(112px,auto)}
.bid-team-meta{min-width:0;overflow-wrap:anywhere}
.bid-team-meta small{display:block;margin-top:2px;color:var(--muted);font-size:12px;line-height:16px}
.bid-row .btn{width:100%;min-width:0}

.workflow{
  display:flex;gap:4px;flex-wrap:wrap;margin:8px 0 16px;
  border-bottom:1px solid var(--line);padding-bottom:10px;
}
.workflow span{
  padding:5px 8px;border:0;border-radius:var(--r-sm);
  background:transparent;color:var(--muted);font-size:13px;font-weight:600;
}
.workflow .current{background:#efe1d3;color:#713b16}

.req{width:100%;border-collapse:collapse}
.req th,.req td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.req th{font-size:12px;color:var(--muted);font-weight:650}
.pass{color:var(--green);font-weight:650}
.fail{color:var(--red);font-weight:650}

.inventory{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;
}
.inv{
  min-width:0;border:1px solid var(--line);border-radius:var(--r-sm);
  padding:10px;background:var(--surface);
}
.footer{
  margin-top:32px;padding-top:16px;border-top:1px solid var(--line);
  color:var(--muted);font-size:13px;line-height:19px;
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}
}
@media (forced-colors:active){
  .btn,.card,.gamecard,.market-card,.notice,.ledger,.inv,.badge{forced-color-adjust:auto}
  .market-card.current{outline:2px solid CanvasText;outline-offset:2px;box-shadow:none}
}
@media(max-width:900px){
  main{padding:24px 16px 40px}
  .two,.three,.auction{grid-template-columns:1fr}
  .market{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:520px){
  html{scroll-padding-top:120px}
  header{position:static;align-items:flex-start;padding:10px 12px}
  .brand small{max-width:26ch}
  .status{padding:6px 12px}
  main{padding:20px 12px 32px}
  .hero h2{font-size:28px}
  .market{grid-template-columns:1fr}
  .effects{grid-template-columns:repeat(2,minmax(0,1fr))}
    .ledger-row{grid-template-columns:36px 36px minmax(0,1fr) 60px 76px;font-size:12px;gap:5px;padding:8px 6px}
  .gamecard .band>*{min-width:0;overflow-wrap:anywhere}
  .bid-row{grid-template-columns:52px minmax(0,1fr) minmax(104px,auto)}
  .bid-row .btn{padding-inline:8px;font-size:12px}
}
@media(max-width:360px){
  .effects{grid-template-columns:1fr}
  .inline>.btn{flex:1 1 100%}
}

.team-summary{display:grid;gap:10px}
.purchase-list{display:grid;gap:6px;margin-top:8px}
.purchase-row{display:grid;grid-template-columns:72px minmax(0,1fr) 100px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.purchase-row:last-child{border-bottom:0}
.reconcile-actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;align-items:end}
.code-box{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:18px;letter-spacing:.04em}
.callout-rule{border-left:4px solid var(--blue);padding:10px 12px;background:#eef3f5;border-radius:var(--r-sm)}
@media(max-width:700px){.reconcile-actions{grid-template-columns:1fr 1fr}.purchase-row{grid-template-columns:56px minmax(0,1fr) 88px}}
@media(max-width:420px){.reconcile-actions{grid-template-columns:1fr}.purchase-row{grid-template-columns:1fr}.purchase-row .btn{width:100%}}

.sr-only{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
.vehicle-preview{margin:12px 0}.vehicle-preview p{margin:8px 0}.vehicle-counts{line-height:1.8}
.check-label{display:flex;align-items:flex-start;gap:10px;padding:12px 0;cursor:pointer}.check-label input{margin-top:4px;min-width:22px;min-height:22px}
.inv label{display:block}.req{table-layout:fixed}.req td,.req th{overflow-wrap:anywhere}.badge,.code-box{overflow-wrap:anywhere;max-width:100%}
@media(max-width:520px){.bid-row{grid-template-columns:48px minmax(0,1fr)!important}.bid-row .btn{grid-column:1 / -1}.ledger-row{overflow-wrap:anywhere}.req{font-size:14px}}
@media(pointer:coarse){button,select,input{min-height:44px}}
.art img{max-width:100%}
</style>
</head>
<body>
<a class="skip-link" href="#mainContent"><span data-i18n="common.skip"></span></a>
<header>
  <div class="brand"><div class="mark">SE</div><div><h1 data-i18n="app.title">Systems Engineering Awareness</h1><small data-i18n="role"></small></div></div>
  <div class="top"><button id="langBtn" class="btn ghost" type="button">FR</button></div>
</header>
<div id="storageNotice" class="notice bad hidden" role="status"></div><div class="status"><span class="badge">v3.0.0-local</span><span id="vehicleBadge" class="badge"></span><span class="badge" data-i18n="role"></span><span id="phaseBadge" class="badge"></span><span id="sessionBadge" class="badge"></span></div>
<main id="mainContent">
<section id="setup" class="section active">
  <div class="hero"><div class="kicker" data-i18n="setup.kicker"></div><h2 data-i18n="setup.title"></h2><p data-i18n="setup.desc"></p></div>
  <div class="grid two">
    <div class="card">
      <div class="field"><label for="sessionInput" data-i18n="setup.code"></label><input id="sessionInput" class="code-box" autocomplete="off" maxlength="32"></div>
      <div class="field"><label for="teamSelect" data-i18n="setup.team"></label><select id="teamSelect"></select></div>
      <div class="field"><label for="vehicleSelect" data-i18n="vehicle.label"></label><select id="vehicleSelect" required></select></div><div id="setupVehiclePreview"></div><p data-i18n="vehicle.hint"></p><p><button id="joinBtn" class="btn primary" type="button" data-i18n="setup.start"></button></p>
      <div id="joinStatus" class="notice info" role="status" aria-live="polite"></div>
    </div>
    <div class="card subtle"><div class="notice info" data-i18n="common.authoritative"></div><p data-i18n="common.warningInfo"></p><p data-i18n="common.private"></p></div>
  </div>
</section>

<section id="practice" class="section">
  <div class="hero"><div class="kicker" data-i18n="practice.kicker"></div><h2 data-i18n="practice.title"></h2><p data-i18n="practice.desc"></p></div>
  <div class="grid two">
    <div class="gamecard"><div class="band"><span data-i18n="category.CAPACITY"></span><span>TRAIN-CAP</span></div><div class="body"><h3 data-i18n="practice.cardTitle"></h3><div class="effects"><div class="effect"><span data-i18n="practice.capacity"></span><strong>+4</strong><small data-i18n="practice.persons"></small></div><div class="effect"><span data-i18n="practice.mobility"></span><strong>-10</strong><small>km/h</small></div></div><div class="price" data-practice-price></div></div></div>
    <div class="card"><div id="practiceStatus" class="notice info"></div><p class="inline"><button id="practiceRecord" class="btn good" type="button" data-i18n="practice.record"></button><button id="practiceReset" class="btn" type="button" data-i18n="practice.reset"></button></p><p><button id="toPlanning" class="btn primary" type="button" disabled data-i18n="practice.toPlanning"></button></p></div>
  </div>
</section>

<section id="planning" class="section">
  <div class="hero"><div class="kicker" data-i18n="planning.kicker"></div><h2 id="planningTitle"></h2></div>
  <div class="grid two">
    <div class="card"><div class="field"><label for="planVehicle" data-i18n="vehicle.label"></label><select id="planVehicle"></select></div><p data-i18n="vehicle.hint"></p><div id="planVehicleNotice" role="status"></div><label class="check-label"><input id="vehicleConfirmed" type="checkbox"><span data-i18n="vehicle.confirm"></span></label><div class="field"><label for="plan" data-i18n="planning.plan"></label><textarea id="plan" maxlength="1200"></textarea><small class="muted" data-i18n="common.warningInfo"></small></div><div class="field"><label for="risks" data-i18n="planning.risks"></label><textarea id="risks" maxlength="1200"></textarea><small class="muted" data-i18n="common.warningInfo"></small></div><div class="field"><label for="maxWtp" data-i18n="planning.maxWtp"></label><input id="maxWtp" inputmode="numeric"></div><p><button id="toAuction" class="btn primary" type="button" data-i18n="planning.toAuction"></button></p></div>
    <div class="card"><h3 data-i18n="planning.requirements"></h3><table id="reqTable" class="req"></table><details><summary><strong data-i18n="planning.rolesTitle"></strong></summary><p data-i18n="planning.roles"></p></details><details><summary><strong data-i18n="planning.guidanceTitle"></strong></summary><ul><li data-i18n="planning.g1"></li><li data-i18n="planning.g2"></li><li data-i18n="planning.g3"></li><li data-i18n="planning.g4"></li><li data-i18n="planning.g5"></li><li data-i18n="planning.g6"></li><li data-i18n="planning.g7"></li></ul></details><details><summary><strong data-i18n="planning.quickRulesTitle"></strong></summary><ol><li data-i18n="planning.r1"></li><li data-i18n="planning.r2"></li><li data-i18n="planning.r3"></li><li data-i18n="planning.r4"></li><li data-i18n="planning.r5"></li><li data-i18n="planning.r6"></li><li data-i18n="planning.r7"></li></ol></details></div>
  </div>
</section>

<section id="auction" class="section">
  <div class="hero"><div class="kicker" data-i18n="auction.kicker"></div><h2 data-i18n="auction.title"></h2><p data-i18n="auction.desc"></p></div>
  <p><button id="finishAuctionBtn" class="btn" type="button" data-i18n="auction.finish"></button></p><div class="card"><h3 data-i18n="auction.position"></h3><div class="grid two"><div class="field"><label for="roundSelect" data-i18n="auction.round"></label><select id="roundSelect"></select></div><div class="field"><label for="lotSelect" data-i18n="auction.lot"></label><select id="lotSelect"></select></div></div></div>
  <div class="auction">
    <div class="gamecard"><div class="band"><span id="cardCat">—</span><span id="cardId">—</span></div><div class="body"><div id="cardArt" class="art"></div><h3 id="cardTitle"></h3><div id="cardEffects" class="effects"></div><strong id="startPrice"></strong></div></div>
    <div class="grid">
      <div class="card"><h3 data-i18n="auction.currentCard"></h3><div class="field"><label for="cardInput" data-i18n="auction.cardInput"></label><input id="cardInput" autocomplete="off" maxlength="24"></div><p><button id="loadCardBtn" class="btn secondary" type="button" data-i18n="auction.load"></button></p><div class="field"><label for="wtp" data-i18n="auction.wtp"></label><input id="wtp" inputmode="numeric"></div><div class="field"><label for="decision" data-i18n="auction.note"></label><textarea id="decision" maxlength="600" data-i18n-placeholder="auction.notePlaceholder"></textarea><small class="muted" data-i18n="common.warningInfo"></small></div><div id="gapNotice" class="notice info"></div></div>
      <div class="card"><h3 data-i18n="auction.afterClose"></h3><div class="field"><label for="wonPrice" data-i18n="auction.winPrice"></label><input id="wonPrice" inputmode="numeric"></div><p class="inline"><button id="recordWinBtn" class="btn good" type="button" data-i18n="auction.won"></button><button id="advanceLocalBtn" class="btn" type="button" data-i18n="auction.notOurs"></button></p></div>
      <div class="card"><h3 data-i18n="auction.inventory"></h3><div id="snapshotMetrics" class="grid two"></div><div id="auctionInventory" class="purchase-list"></div></div>
    </div>
  </div>
</section>

<section id="build" class="section">
  <div class="hero"><div class="kicker" data-i18n="build.kicker"></div><h2 data-i18n="build.title"></h2><p data-i18n="build.desc"></p></div>
  <div class="grid two">
    <div class="card"><h3 data-i18n="build.localPurchases"></h3><p data-i18n="common.correctOnly"></p><div id="reconcileInventory" class="purchase-list"></div></div>

}

function joinCompanion(){
 if(state.phase!=='setup'||state.team||recoveryBlocked)return false;
 try{const cfg=parseSessionCode($('#sessionInput').value),id=Number($('#teamSelect').value),mission=$('#vehicleSelect').value,all=createTeams(cfg);if(!all[id-1]||!validMission(mission))throw new Error('choice');
 state.sessionCode=cfg.code;state.teamCount=cfg.teamCount;state.teamId=id;state.team=all[id-1];state.team.mission=mission;state.lockedMission=null;state.vehicleConfirmed=false;state.round=0;state.lot=0;state.currentCard=null;phase('practice');renderAll();return true;
 }catch{alert(t('errors.badCode'));return false}
}
function setStudentVehicle(mission){
 if(state.phase!=='planning'||state.lockedMission||state.team.purchases.length||!validMission(mission))return false;
 if(state.team.mission===mission)return true;
 state.team.mission=mission;state.vehicleConfirmed=false;state.vehicleChangeNotice=true;saveState();renderAll();$('#planVehicleNotice').textContent=t('vehicle.changeNotice');return true;
}
function startStudentAuction(){
 if(state.phase!=='planning'||state.lockedMission||!state.team||!validMission(state.team.mission))return false;
 if(!state.vehicleConfirmed){alert(t('vehicle.needConfirm'));return false}
 state.lockedMission=state.team.mission;state.team.lockedMission=state.team.mission;state.planBaseline=state.plan;
 phase('auction');renderAll();return true;
}
function validateStudentSave(x){
 const cfg=validateBase(x);must(x.team&&x.team.id===x.teamId&&x.teamId<=cfg.teamCount);
 const tm=cleanTeam(x.team);if(['auction','build','submit','debrief','closed'].includes(x.phase))must(x.lockedMission===tm.mission&&tm.lockedMission===tm.mission);else must(x.lockedMission===null&&tm.purchases.length===0);
 must(typeof x.vehicleConfirmed==='boolean'&&typeof x.practiceWon==='boolean');
 for(const key of ['plan','risks'])must(typeof x[key]==='string'&&x[key].length<=1200);must(x.planBaseline===null||(typeof x.planBaseline==='string'&&x.planBaseline.length<=1200));
 must(validCents(x.maxWtpCents)&&validCents(x.profitCents)&&['AMOUNT','PERCENT'].includes(x.profitMode)&&typeof x.profitInput==='string'&&x.profitInput.length<=20);addCents(tm.cost,x.profitCents);
 must(x.scratch&&typeof x.scratch==='object'&&!Array.isArray(x.scratch)&&Object.keys(x.scratch).length<=70);
 for(const[key,v]of Object.entries(x.scratch))must(/^[1-7]-(10|[1-9])$/.test(key)&&v&&typeof v.wtp==='string'&&v.wtp.length<=20&&typeof v.note==='string'&&v.note.length<=600);
 if(x.currentCard){const c=cardAt(x.currentCard.id,x.round+1,x.lot+1);must(x.currentCard.instance===c.instance);x.currentCard=c}
 return {...x,team:tm};
}
function calculateDraftProfit(mode,input){
 const p=mode==='AMOUNT'?parseAmount(input):profitFromBps(state.team.cost,parsePercentBps(input));addCents(state.team.cost,p);return p;
}
function changeProfitMode(){
 if(state.phase!=='submit')return;const mode=$('#profitMode').value;
 if(mode===state.profitMode)return;
 if(mode==='AMOUNT'){state.profitMode=mode;state.profitInput=amountInput(state.profitCents)}
 else{if(state.team.cost===0&&state.profitCents!==0){$('#profitMode').value=state.profitMode;return}state.profitMode=mode;const bps=state.team.cost===0?0n:(BigInt(state.profitCents)*10000n+BigInt(Math.floor(state.team.cost/2)))/BigInt(state.team.cost);state.profitInput=(bps/100n).toString()+'.'+(bps%100n).toString().padStart(2,'0')}
 renderSubmit();
}

const STORE_KEY="SEA_STUDENT_V300";
let state={phase:"setup",schema:3,lang:"en",vehicleConfirmed:false,lockedMission:null,sessionCode:null,teamCount:0,teamId:null,team:null,round:0,lot:0,currentCard:null,plan:"",planBaseline:null,risks:"",maxWtpCents:85000000,scratch:{},profitMode:"AMOUNT",profitInput:"250000",profitCents:25000000,practiceWon:false};

function phase(p){
 const i=PHASES.indexOf(state.phase),j=PHASES.indexOf(p);if(j<0||!(i===j||j===i+1))return false;
 if(p==='auction'&&!state.lockedMission)return false;
 const moved=state.phase!==p;state.phase=p;$$('.section').forEach(x=>x.classList.toggle('active',x.id===p));$('#phaseBadge').textContent=t('phase.'+p);if(moved){window.scrollTo(0,0);const h=document.querySelector('#'+p+' h2');if(h){h.tabIndex=-1;h.focus({preventScroll:true})}}saveState();return true;
}

function saveState(){if(recoveryBlocked)return false;if(!state.sessionCode)return true;try{state.lang=lang;sessionStorage.setItem(STORE_KEY,JSON.stringify(state));return true}catch{storageFailed=true;storageNotice('common.refresh');return false}}

function restoreState(){
 let raw;try{raw=sessionStorage.getItem(STORE_KEY)}catch{storageFailed=true;return false}if(!raw)return false;
 try{must(raw.length<=250000);const x=validateStudentSave(JSON.parse(raw));state=x;lang=x.lang;return true}catch{recoveryBlocked=true;storageNotice('common.badRecovery');return false}
}
function scratchKey(){return `${state.round+1}-${state.lot+1}`}
function scratch(){return state.scratch[scratchKey()]||(state.scratch[scratchKey()]={wtp:"",note:""})}

function populateTeamSelect(code){const cfg=parseSessionCode(code),prev=$('#teamSelect').value;$('#teamSelect').innerHTML=`<option value="">${t('setup.team')}</option>`+Array.from({length:cfg.teamCount},(_,i)=>`<option value="${i+1}">${t('common.team',{n:i+1})}</option>`).join('');if(Number(prev)>0&&Number(prev)<=cfg.teamCount)$('#teamSelect').value=prev;return cfg}
function renderRequirements(){const r=req(state.team);$("#reqTable").innerHTML=`<tr><th>${t("planning.requirements")}</th><th>${t("common.minimum")}</th></tr>`+Object.entries(r).map(([k,v])=>`<tr><td>${esc(LABELS[k][lang][0])}</td><td>${v} ${esc(LABELS[k][lang][1])}</td></tr>`).join("")}

function renderPractice(){$('#toPlanning').disabled=!state.practiceWon;$('#practiceStatus').textContent=state.practiceWon?t('practice.statusWon',{amount:money(35000000)}):t('practice.statusReady');saveState()}

function renderPlanning(){
 $('#planningTitle').textContent=`${t('common.team',{n:state.team.id})} — ${MISSIONS[state.team.mission][lang]}`;
 $('#planVehicle').innerHTML=vehicleOptions(state.team.mission);$('#planVehicle').disabled=!!state.lockedMission;$('#vehicleConfirmed').checked=state.vehicleConfirmed;
 $('#planVehicleNotice').textContent=state.vehicleChangeNotice?t('vehicle.changeNotice'):'';$('#toAuction').disabled=!state.vehicleConfirmed;$('#plan').value=state.plan;$('#risks').value=state.risks;$('#maxWtp').value=amountInput(state.maxWtpCents);renderRequirements();
}
function currentExpectedSlot(){return SLOT_ORDER[state.lot]}

function loadCurrentCard(){if(state.phase!=='auction')return;const raw=$('#cardInput').value.trim().toUpperCase(),c=CARD_INDEX.get(raw);if(!c)return alert(t('errors.badCard'));const slot=currentExpectedSlot();if(c.cat!==slot)return alert(t('errors.wrongSlot',{slot:categoryName(slot)}));state.currentCard=cardAt(c.id,state.round+1,state.lot+1);saveState();renderAuction()}
function renderCard(){const c=state.currentCard;if(!c){$("#cardCat").textContent="—";$("#cardId").textContent="—";$("#cardTitle").textContent=t("common.hidden");$("#cardEffects").innerHTML="";$("#cardArt").innerHTML=`<div style="height:100%;display:grid;place-items:center">${t("common.hidden")}</div>`;$("#startPrice").textContent="";return}$("#cardCat").textContent=categoryName(c.cat);$("#cardId").textContent=c.id;$("#cardTitle").textContent=c.title[lang];$("#cardEffects").innerHTML=effectsHtml(c);$("#cardArt").innerHTML=art(c);$("#startPrice").textContent=t("common.starting",{amount:money(c.start)})}

function renderGaps(){
 const c=state.currentCard,parts=[];for(const[k,min]of Object.entries(req(state.team))){const now=state.team.totals[k],after=c?now+(c.e[k]||0):now;
 if(now<min||after<min)parts.push(`${LABELS[k][lang][0]} ${now}/${min}${c?` → ${after}/${min}`:''}`)}
 $('#gapNotice').textContent=parts.length?parts.join(' · '):t('auction.noGaps');
}
function renderSnapshot(){const tm=state.team;$("#snapshotMetrics").innerHTML=`<div class="metric"><div class="label">${t("common.cost")}</div><div class="value">${money(tm.cost)}</div></div><div class="metric"><div class="label">${t("common.score")}</div><div class="value">${score(tm)}</div></div>`;$("#auctionInventory").innerHTML=tm.purchases.length?tm.purchases.map(p=>`<div class="purchase-row"><span>R${p.round}·L${p.lot}</span><span>${esc(p.id)} — ${esc(p.title[lang])}</span><strong>${money(p.paid)}</strong></div>`).join(""):`<div class="muted">${t("auction.noPurchases")}</div>`}
function renderAuction(){$("#roundSelect").value=String(state.round+1);$("#lotSelect").value=String(state.lot+1);const s=scratch();$("#wtp").value=s.wtp;$("#decision").value=s.note;renderCard();renderGaps();renderSnapshot();saveState()}

function setPosition(){if(state.phase!=='auction')return;const round=Number($('#roundSelect').value),lot=Number($('#lotSelect').value);if(!Number.isInteger(round)||round<1||round>7||!Number.isInteger(lot)||lot<1||lot>10)return;state.round=round-1;state.lot=lot-1;state.currentCard=null;$('#cardInput').value='';$('#wonPrice').value='';renderAuction()}

function recordWin(){
 if(state.phase!=='auction'||!state.lockedMission)return false;
 if(!state.currentCard){alert(t('errors.loadFirst'));return false}
 try{acquire(state.team,state.currentCard,parseWholeDollars($('#wonPrice').value));state.currentCard=null;saveState();advancePosition();return true}
 catch(e){alert(t(e.message==='duplicate'?'errors.duplicate':e.message==='limit'?'errors.purchaseLimit':'errors.moneyRange'));return false}
}

function advancePosition(){if(state.phase!=='auction')return false;if(state.lot<9)state.lot++;else if(state.round<6){state.round++;state.lot=0}else{state.currentCard=null;phase('build');renderAll();return true}state.currentCard=null;$('#cardInput').value='';$('#wonPrice').value='';renderAuction();return true}

function renderReconcileInventory(){
 $('#reconcileInventory').innerHTML=state.team.purchases.length?state.team.purchases.map((p,i)=>`<div class="purchase-row"><span>R${p.round}·L${p.lot}</span><span>${esc(p.id)} — ${esc(p.title[lang])}</span><span><strong>${money(p.paid)}</strong> <button class="btn" data-remove-purchase="${i}">${t('common.remove')}</button></span></div>`).join(''):`<div class="muted">${t('auction.noPurchases')}</div>`;
 $$('[data-remove-purchase]').forEach(b=>b.onclick=()=>{if(state.phase!=='build')return;if(!confirm(t('common.correctOnly')))return;removePurchase(state.team,Number(b.dataset.removePurchase));saveState();renderBuild()});
}

function addMissingPurchase(){
 if(state.phase!=='build')return false;
 try{const c=cardAt($('#addCard').value.trim().toUpperCase(),Number($('#addRound').value),Number($('#addLot').value)),paid=parseWholeDollars($('#addPrice').value);acquire(state.team,c,paid);$('#addCard').value='';$('#addPrice').value='';saveState();renderBuild();return true}
 catch(e){alert(t(e.message==='duplicate'?'errors.duplicate':e.message==='limit'?'errors.purchaseLimit':'errors.moneyRange'));return false}
}
function renderBuild(){renderReconcileInventory();$("#capMetrics").innerHTML=Object.entries(state.team.totals).map(([k,v])=>`<div class="metric"><div class="label">${esc(LABELS[k][lang][0])}</div><div class="value">${v}</div></div>`).join("");$("#complianceTable").innerHTML=`<tr><th>${t("planning.requirements")}</th><th>${t("common.total")}</th><th>${t("common.minimum")}</th><th>${t("common.status")}</th></tr>`+Object.entries(req(state.team)).map(([k,min])=>`<tr><td>${esc(LABELS[k][lang][0])}</td><td>${state.team.totals[k]}</td><td>${min}</td><td class="${state.team.totals[k]>=min?"pass":"fail"}">${state.team.totals[k]>=min?t("common.pass"):t("common.shortfall")}</td></tr>`).join("");$("#overall").className="notice "+(compliant(state.team)?"good":"bad");$("#overall").textContent=compliant(state.team)?t("build.allPass"):t("build.hasShortfalls");saveState()}

function calculateProfit(){try{state.profitCents=calculateDraftProfit(state.profitMode,state.profitInput);return true}catch{return false}}

function renderSubmit(){
 $('#profitMode').value=state.profitMode;$('#profitInput').value=state.profitInput;$('#profitLabel').textContent=t(state.profitMode==='AMOUNT'?'submit.valueAmount':'submit.valuePercent');
 const ok=calculateProfit(),sc=score(state.team),bid=ok?addCents(state.team.cost,state.profitCents):null;
 $('#submitMetrics').innerHTML=`<div class="metric"><div class="label">${t('common.cost')}</div><div class="value">${money(state.team.cost)}</div></div><div class="metric"><div class="label">${t('common.profit')}</div><div class="value">${ok?money(state.profitCents,2):'—'}</div></div><div class="metric"><div class="label">${t('common.bid')}</div><div class="value">${ok?money(bid,2):'—'}</div></div><div class="metric"><div class="label">${t('common.cpp')}</div><div class="value">${ok?ratioDisplay(bid,sc):'—'}</div></div>`;
 $('#profitInput').setAttribute('aria-invalid',String(!ok));$('#toDebrief').disabled=!ok;
 $('#eligibility').className='notice '+(ok&&compliant(state.team)&&sc>0?'good':'bad');$('#eligibility').textContent=!ok?t('errors.moneyRange'):compliant(state.team)&&sc>0?t('submit.localEligible'):t('submit.localIneligible');saveState();
}
function renderDebrief(){const sc=score(state.team),bid=addCents(state.team.cost,state.profitCents),procs=state.team.purchases.filter(p=>p.cat==="SE_PROCESS");$("#debriefCard").innerHTML=`<h3>${t("common.team",{n:state.team.id})} — ${esc(MISSIONS[state.team.mission][lang])}</h3><p>${compliant(state.team)?t("common.compliant"):t("common.noncompliant")} · ${t("common.score")} ${sc} · ${t("common.cost")} ${money(state.team.cost)} · ${t("common.profit")} ${money(state.profitCents)} · ${t("common.bid")} ${money(bid)} · ${t("common.cpp")} ${ratioDisplay(bid,sc)}</p><p><strong>${t("debrief.originalPlan")}:</strong> ${esc((state.planBaseline??state.plan)||"—")}</p><p><strong>${t("debrief.risks")}:</strong> ${esc(state.risks||"—")}</p><p><strong>${t("debrief.outcome")}:</strong> ${state.team.purchases.length} ${t("common.purchases")}; ${compliant(state.team)?t("common.compliant"):t("common.noncompliant")}. ${procs.length?`${t("debrief.process")}: ${esc(procs[0].title[lang])}`:t("debrief.noProcess")}</p>`;saveState()}

function renderAll(){
 state.lang=lang;applyI18n();$('#phaseBadge').textContent=t('phase.'+state.phase);$('#sessionBadge').textContent=state.sessionCode||'—';
 $('#vehicleBadge').textContent=state.team?`${t('common.team',{n:state.team.id})} · ${MISSIONS[state.team.mission][lang]}${state.lockedMission?' · '+t('vehicle.locked'):''}`:t('vehicle.choose');
 if(state.phase==='setup'){const selected=$('#vehicleSelect').value;$('#vehicleSelect').innerHTML=vehicleOptions(selected);renderVehiclePreview('setupVehiclePreview',selected);if($('#sessionInput').value){try{populateTeamSelect($('#sessionInput').value);$('#joinStatus').textContent=t('setup.valid')}catch{$('#joinStatus').textContent=t('setup.invalid')}}}
 if(state.phase==='practice')renderPractice();if(state.phase==='planning')renderPlanning();if(state.phase==='auction')renderAuction();if(state.phase==='build')renderBuild();if(state.phase==='submit')renderSubmit();if(state.phase==='debrief')renderDebrief();if(state.phase==='closed'){renderDebrief();$('#closedSummary').innerHTML=$('#debriefCard').innerHTML}
 if(recoveryBlocked)storageNotice('common.badRecovery');else if(storageFailed)storageNotice('common.refresh');
}
$("#teamSelect").innerHTML=`<option value="">—</option>`;
$("#vehicleSelect").innerHTML=vehicleOptions(null);
$("#roundSelect").innerHTML=Array.from({length:7},(_,i)=>`<option value="${i+1}">${i+1}</option>`).join("");
$("#lotSelect").innerHTML=Array.from({length:10},(_,i)=>`<option value="${i+1}">${i+1}</option>`).join("");
$("#addRound").innerHTML=$("#roundSelect").innerHTML;$("#addLot").innerHTML=$("#lotSelect").innerHTML;
$("#sessionInput").oninput=()=>{try{populateTeamSelect($("#sessionInput").value);$("#joinStatus").className="notice good";$("#joinStatus").textContent=t("setup.valid")}catch{$("#teamSelect").innerHTML=`<option value="">—</option>`;$("#joinStatus").className="notice bad";$("#joinStatus").textContent=t("setup.invalid")}};
$("#joinBtn").onclick=joinCompanion;
$("#practiceRecord").onclick=()=>{state.practiceWon=true;renderPractice()};
$("#practiceReset").onclick=()=>{state.practiceWon=false;renderPractice()};
$("#toPlanning").onclick=()=>{if(state.phase!=="practice"||!state.practiceWon)return;state.practiceWon=false;phase("planning");renderAll()};
$("#plan").oninput=e=>{state.plan=e.target.value;saveState()};
$("#risks").oninput=e=>{state.risks=e.target.value;saveState()};
$("#maxWtp").onchange=e=>{try{state.maxWtpCents=parseWholeDollars(e.target.value);saveState()}catch{alert(t("errors.badMoney"));e.target.value=state.maxWtpCents/100}};
$("#toAuction").onclick=startStudentAuction;
$("#roundSelect").onchange=setPosition;$("#lotSelect").onchange=setPosition;
$("#loadCardBtn").onclick=loadCurrentCard;
$("#wtp").onchange=e=>{try{scratch().wtp=String(parseWholeDollars(e.target.value)/100);e.target.value=scratch().wtp;saveState()}catch{alert(t("errors.badMoney"));e.target.value=scratch().wtp}};
$("#decision").oninput=e=>{scratch().note=e.target.value;saveState()};
$("#recordWinBtn").onclick=recordWin;
$("#advanceLocalBtn").onclick=advancePosition;
$("#addPurchaseBtn").onclick=addMissingPurchase;
$("#toSubmit").onclick=()=>{if(state.phase!=="build")return;phase("submit");renderAll()};
$("#profitMode").onchange=changeProfitMode;
$("#profitInput").oninput=()=>{state.profitInput=$("#profitInput").value;renderSubmit()};
$("#toDebrief").onclick=()=>{if(state.phase!=="submit")return;if(!calculateProfit())return alert(t("errors.badMoney"));phase("debrief");renderAll()};
$("#vehicleSelect").onchange=()=>renderVehiclePreview("setupVehiclePreview",$("#vehicleSelect").value);
$("#planVehicle").onchange=e=>setStudentVehicle(e.target.value);
$("#vehicleConfirmed").onchange=e=>{if(state.phase!=="planning"||state.lockedMission)return;state.vehicleConfirmed=e.target.checked;saveState();$("#toAuction").disabled=!state.vehicleConfirmed};
$("#finishAuctionBtn").onclick=()=>{if(state.phase!=="auction")return;if(confirm(t("auction.finishConfirm"))){state.currentCard=null;phase("build");renderAll()}};
$("#toClosed").onclick=()=>{if(state.phase!=="debrief")return;phase("closed");renderAll()};
$("#langBtn").onclick=()=>{lang=lang==="en"?"fr":"en";renderAll();saveState()};
if(restoreState()){$("#sessionInput").value=state.sessionCode;populateTeamSelect(state.sessionCode);$("#teamSelect").value=String(state.teamId);$("#joinStatus").className="notice good";$("#joinStatus").textContent=t("setup.recovered");phase(state.phase)}else{$("#joinStatus").textContent=safeSessionStorage()?t("setup.waiting"):t("setup.noStorage");phase("setup")}
renderAll();
</script>
</body></html>
