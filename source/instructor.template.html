<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
{{SEA_CSP}}
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#252a27">
<title>Systems Engineering Awareness</title>
{{SEA_STYLES}}
</head>
<body>
<a class="skip-link" href="#mainContent"><span data-i18n="common.skip"></span></a>
<header data-scene-priority="100" data-scene-section="help">
  <div class="brand"><div class="mark">SE</div><div><h1 data-i18n="app.title">Systems Engineering Awareness</h1><small data-i18n="role"></small></div></div>
  <div class="top"><details class="save-menu"><summary data-i18n="backup.menu">Save & restore</summary><div><button id="exportBackupBtn" class="btn ghost" type="button" data-i18n="backup.export"></button><button id="importBackupBtn" class="btn ghost" type="button" data-i18n="backup.import"></button><button id="restorePreviousBtn" class="btn ghost" type="button" data-i18n="backup.restorePrevious" disabled></button><input id="backupFile" class="sr-only" type="file" accept="application/json,.json" tabindex="-1" aria-hidden="true"></div></details><button id="langBtn" class="btn ghost" type="button">FR</button></div>
</header>
<div id="storageNotice" class="notice bad hidden" role="status"></div><div id="backupStatus" class="notice info hidden" role="status" aria-live="polite"></div><div class="status"><span class="badge">v{{SEA_VERSION}}</span><span id="phaseBadge" class="badge"></span><span id="sessionBadge" class="badge"></span></div>
<main id="mainContent">
<section id="sea3dScene" class="sea3d-stage" aria-labelledby="sea3d-title" data-scene-priority="90" data-scene-section="inspect">
 <div class="sea3d-heading"><h2 id="sea3d-title">Your vehicle</h2><details class="view-controls"><summary id="sea3d-views">Views</summary><div class="inline"><button id="sea3d-reset" class="btn ghost" type="button">Reset view</button><button id="sea3d-front" class="btn ghost" type="button">Front</button><button id="sea3d-rear" class="btn ghost" type="button">Rear</button></div></details></div>
 <div class="sea3d-toolbar">
  <label><span id="sea3d-team">Team</span><select id="sea3dTeam"></select></label>
  <label><span id="sea3d-object">Inspect</span><select id="sea3dObject"></select></label>

 </div>
 <div class="sea3d-inspection"><label><span id="sea3d-mode">View</span><select id="sea3dMode"><option value="assembled">Assembled</option><option value="exploded">Exploded</option><option value="cutaway">Cutaway</option></select></label><label class="sea3d-shadow"><input id="sea3dShadows" type="checkbox" checked><span id="sea3d-shadows">Shadows</span></label><label id="sea3dSeparation" hidden><span id="sea3d-separation">Separation</span><input id="sea3dAmount" type="range" min="0" max="100" value="70" step="1"><output id="sea3dPercent" for="sea3dAmount">70%</output></label></div>
 <div id="sea3dViewport" role="img" aria-label="Vehicle and equipment" aria-describedby="sea3dStatus" hidden></div>
 <details id="sea3dMap"><summary id="sea3d-map">Assembly map</summary><div id="sea3dParts" class="sea3d-parts"></div></details>
 <p id="sea3dStatus" role="status" aria-live="polite"></p><p id="sea3d-hint" class="muted"></p>
</section>
<section id="setup" class="section active">
  <div class="hero" data-scene-priority="70" data-scene-section="help"><div class="kicker" data-i18n="setup.kicker"></div><h2 data-i18n="setup.title"></h2><p data-i18n="setup.desc"></p></div>
  <div class="grid two">
    <div class="card">
      <div class="field"><label for="teamCount" data-i18n="setup.teams"></label><select id="teamCount" data-scene-priority="20"></select></div>
      <div class="callout-rule"><strong data-i18n="setup.reveal.round"></strong></div><details><summary><strong data-i18n="setup.otherReveal"></strong></summary><div class="field" style="margin-top:10px"><label for="revealMode" data-i18n="setup.reveal"></label><select id="revealMode" data-scene-priority="20"><option value="ROUND" data-i18n="setup.reveal.round"></option><option value="JIT" data-i18n="setup.reveal.jit"></option><option value="MANUAL" data-i18n="setup.reveal.manual"></option></select></div></details>
      <div class="grid two">
        <div class="field"><label for="timingMode" data-i18n="setup.timing"></label><select id="timingMode" data-scene-priority="20"><option value="TIMED" data-i18n="setup.timed"></option><option value="UNTIMED" data-i18n="setup.untimed"></option></select></div>
        <div class="field"><label for="bidSeconds" data-i18n="setup.bidWindow"></label><input id="bidSeconds" type="number" min="10" max="120" step="5" value="30" data-scene-priority="20"></div>
      </div>
      <p><button id="generateBtn" class="btn primary" type="button" data-i18n="setup.generate" data-scene-priority="30"></button></p>
      <div id="setupStatus" class="notice info" role="status" aria-live="polite" data-scene-priority="30"></div>
      <div id="recoveryStatus" class="notice info" role="status" aria-live="polite" data-i18n="setup.recovery"></div>
    </div>
    <div class="card subtle">
      <h3 data-i18n="setup.sessionCode"></h3>
      <div id="sessionCode" class="metric" data-scene-priority="35"><div class="value code-box">-</div></div>
      <p data-i18n="setup.assignmentNote"></p>
      <div class="callout-rule" data-i18n="setup.privateMarket"></div><p class="muted" data-i18n="setup.randomHonesty"></p>
      <p data-i18n="vehicle.instructorHint"></p><div id="setupVehicleStatus" class="notice info" role="status" data-scene-priority="35"></div><div id="assignmentList" class="inventory" style="margin-top:12px" data-scene-priority="40"></div>
      <p><button id="startTutorialBtn" class="btn good" type="button" disabled data-i18n="setup.startTutorial" data-scene-priority="50"></button></p>
    </div>
  </div>
</section>

<section id="practice" class="section">
  <div class="hero" data-scene-priority="70" data-scene-section="help"><div class="kicker" data-i18n="practice.kicker"></div><h2 data-i18n="practice.title"></h2><p data-i18n="practice.desc"></p></div>
  <div class="auction">
    <div class="gamecard"><div class="band"><span data-i18n="category.CAPACITY"></span><span>TRAIN-CAP</span></div><div class="body"><div class="art" id="practiceArt" aria-label="Training capacity illustration"></div><h3 data-i18n="practice.cardTitle"></h3><div class="effects"><div class="effect"><span data-i18n="practice.capacity"></span><strong>+4</strong><small data-i18n="practice.persons"></small></div><div class="effect"><span data-i18n="practice.mobility"></span><strong>-10</strong><small>km/h</small></div></div><div class="price" data-practice-price></div></div></div>
    <div class="card">
      <div id="practiceStatus" class="notice info" role="status" aria-atomic="true"></div>
      <p class="inline"><button id="practiceReveal" class="btn secondary" type="button" data-i18n="practice.reveal"></button><button id="practiceOpen" class="btn primary" type="button" data-i18n="practice.open"></button><button id="practiceAccept" class="btn" type="button" data-i18n="practice.accept"></button><button id="practiceClose" class="btn danger" type="button" data-i18n="practice.close"></button></p>
      <p class="inline"><button id="practiceReset" class="btn" type="button" data-i18n="practice.reset" data-scene-priority="80"></button><button id="toPlanning" class="btn good" type="button" disabled data-i18n="practice.toPlanning"></button></p>
    </div>
  </div>
</section>

<section id="planning" class="section">
  <div class="hero" data-scene-priority="70" data-scene-section="help"><div class="kicker" data-i18n="planning.kicker"></div><h2 data-i18n="planning.title"></h2><p data-i18n="planning.desc"></p></div>
  <div class="card"><p data-i18n="vehicle.instructorHint"></p><div id="planningVehicleStatus" class="notice info" role="status" data-scene-priority="20"></div><div id="vehicleMix" class="notice info" data-scene-priority="20"></div><div id="planningTeams" class="inventory" data-scene-priority="30"></div><p><button id="startAuctionBtn" class="btn primary" type="button" data-i18n="planning.startAuction" data-scene-priority="40"></button></p></div>
</section>

<section id="auction" class="section">
  <div class="hero" data-scene-priority="70" data-scene-section="help"><div class="kicker" data-i18n="auction.kicker"></div><h2 data-i18n="auction.title"></h2><p id="auctionRule"></p></div>
  <div class="workflow" id="workflow" data-scene-section="help" data-scene-priority="70"></div>
  <div class="card"><div class="space"><h3 id="roundHeading" data-scene-priority="10"></h3><span id="lotBadge" class="badge" data-scene-priority="10"></span></div><div id="market" data-scene-section="market" class="market" data-scene-priority="70"></div></div>
  <div class="auction">
    <div class="gamecard" data-scene-summary="true" data-scene-priority="15"><div class="band"><span id="cardCat" data-scene-priority="15"></span><span id="cardId" data-scene-priority="15"></span></div><div class="body"><div class="art" id="cardArt"></div><h3 id="cardTitle" data-scene-priority="15"></h3><div id="cardEffects" class="effects" data-scene-priority="15"></div><div class="space"><strong id="startPrice" data-scene-priority="15"></strong><strong id="leaderText" data-scene-priority="15"></strong></div></div></div>
    <div class="grid">
      <div class="card">
        <div class="grid three" data-scene-summary="true" data-scene-priority="20">
          <div class="metric" data-scene-priority="20"><div class="label" data-i18n="auction.currentLeader"></div><div class="value" id="leaderSummary">-</div></div>
          <div id="nextBidMetric" class="metric" data-scene-priority="20"><div class="label" data-i18n="auction.nextLegal"></div><div class="value" id="nextBid">-</div></div>
          <div class="metric" data-scene-priority="20"><div class="label" data-i18n="auction.time"></div><div class="value" id="timerValue">-</div></div>
        </div>
        <p class="inline"><button id="revealBtn" data-scene-current-action="true" class="btn secondary" type="button" data-i18n="auction.reveal" data-scene-priority="25"></button><button id="openBtn" data-scene-current-action="true" class="btn primary" type="button" data-i18n="auction.open" data-scene-priority="25"></button><button id="pauseBtn" data-scene-section="tools" class="btn" type="button" data-i18n="auction.pause" data-scene-priority="25"></button><button id="extendBtn" data-scene-section="tools" class="btn" type="button" data-i18n="auction.extend" data-scene-priority="25"></button></p>
        <h4 data-scene-section="teams" data-i18n="auction.acceptCaller"></h4><p data-scene-section="teams" class="muted" data-i18n="auction.acceptDesc"></p><div id="bidRoster" data-scene-section="teams" class="ledger" data-scene-priority="30"></div>
        <hr><h4 data-scene-section="tools" data-i18n="auction.commitTitle"></h4><div id="commitSummary" data-scene-section="tools" class="notice info" data-scene-priority="35"></div>
        <p class="inline"><button id="commitLeaderBtn" data-scene-current-action="true" class="btn danger" type="button" data-i18n="auction.commitLeader" data-scene-priority="40"></button><button id="commitUnsoldBtn" data-scene-current-action="true" class="btn" type="button" data-i18n="auction.commitUnsold" data-scene-priority="40"></button></p>
        <details id="preCommitCorrection" data-scene-section="tools"><summary><strong data-i18n="auction.correct"></strong></summary><p class="muted" data-i18n="auction.correctDesc"></p><div class="grid two"><div class="field"><label for="winnerSelect" data-i18n="auction.winner"></label><select id="winnerSelect"></select></div><div class="field"><label for="finalPrice" data-i18n="auction.finalPrice"></label><input id="finalPrice" inputmode="numeric" maxlength="12"></div></div><div class="field"><label for="saleCorrectionReason" data-i18n="auction.correctionReason"></label><input id="saleCorrectionReason" maxlength="120"><small data-i18n="common.warningInfo"></small></div><button id="commitCorrectedBtn" class="btn danger" type="button" data-i18n="auction.commitCorrected"></button></details>
        <div id="timerAnnouncement" class="sr-only" role="status" aria-live="polite"></div><div id="commitStatus" data-scene-section="tools" class="notice info" role="status" aria-live="polite" data-scene-priority="40"></div>
        <details id="postCommitCorrection" data-scene-section="tools"><summary><strong data-i18n="auction.correction"></strong></summary><p class="muted" data-i18n="auction.correctionDesc"></p><div class="field"><label for="correctionReason" data-i18n="auction.correctionReason"></label><input id="correctionReason" maxlength="120"><small class="muted" data-i18n="common.warningInfo"></small></div><button id="voidCurrentBtn" class="btn danger" type="button" data-i18n="auction.void"></button></details>
        <p><button id="advanceBtn" data-scene-current-action="true" class="btn good" type="button" data-i18n="auction.advance" data-scene-priority="50"></button></p>
      </div>
      <details data-scene-section="tools" class="card"><summary><strong data-i18n="auction.ledger"></strong></summary><div id="ledger" data-scene-section="tools" class="ledger" data-scene-priority="75"></div></details>
    </div>
  </div>
</section>

<section id="build" class="section">
  <div class="hero" data-scene-priority="70" data-scene-section="help"><div class="kicker" data-i18n="build.kicker"></div><h2 data-i18n="build.title"></h2><p data-i18n="build.desc"></p></div>
  <div id="authoritativeBuild" class="grid two" data-scene-section="teams" data-scene-priority="20"></div>
  <p><button id="openSubmissionsBtn" class="btn primary" type="button" data-i18n="build.openSubmissions" data-scene-priority="40"></button></p>
</section>

<section id="submit" class="section">
  <div class="hero" data-scene-priority="70" data-scene-section="help"><div class="kicker" data-i18n="submit.kicker"></div><h2 data-i18n="submit.title"></h2><p data-i18n="submit.desc"></p></div>
  <div class="notice info" data-i18n="submit.incentive"></div>
  <div id="privateSubmitGuard" class="notice info" data-scene-priority="15"><p data-i18n="submit.privateHint"></p><button id="privateSubmitBtn" class="btn" type="button" data-i18n="submit.privateOpen"></button></div><div id="submissionRows" class="card" data-scene-priority="20"></div>
  <p><button id="closeSubmissionsBtn" class="btn primary" type="button" data-i18n="submit.close" data-scene-priority="50"></button></p>
</section>

<section id="debrief" class="section">
  <div class="hero" data-scene-priority="70" data-scene-section="help"><div class="kicker" data-i18n="debrief.kicker"></div><h2 data-i18n="debrief.title"></h2></div>
  <div class="grid two"><div id="ranking" class="card" data-scene-priority="20"></div><div class="card"><h3 data-i18n="debrief.prompts"></h3><ol><li data-i18n="debrief.p1"></li><li data-i18n="debrief.p2"></li><li data-i18n="debrief.p3"></li><li data-i18n="debrief.p4"></li><li data-i18n="debrief.p5"></li><li data-i18n="debrief.p6"></li><li data-i18n="debrief.p7"></li><li data-i18n="debrief.p8"></li></ol><p><strong data-i18n="debrief.transfer"></strong></p></div></div>
  <p><button id="closeRoomBtn" class="btn primary" type="button" data-i18n="debrief.close" data-scene-priority="50"></button></p>
</section>

<section id="closed" class="section">
  <div class="hero" data-scene-priority="70" data-scene-section="help"><div class="kicker" data-i18n="closed.kicker"></div><h2 data-i18n="closed.title"></h2><p data-i18n="closed.note"></p></div>
  <div class="card"><h3 data-i18n="closed.ledger"></h3><div id="closedLedger" class="ledger" data-scene-section="teams" data-scene-priority="20"></div></div>
  <p><button id="startNewSessionBtn" class="btn" type="button" data-i18n="closed.newSession" data-scene-section="task" data-scene-priority="25"></button></p>
</section>

<p class="footer" data-scene-section="help" data-scene-priority="90"><span data-i18n="common.noBackend"></span> <span data-i18n="common.syntheticDeck"></span></p>
</main>
{{SEA_SCRIPT}}
</body></html>
