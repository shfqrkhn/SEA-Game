name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    # Support is Windows 11 only (MPES §4.3). Hosted runners are Windows Server, the closest available;
    # Windows 11 evidence comes from local runs (MPES §16.5).
    runs-on: windows-latest
    env:
      # Full engine set on current LTS; Chromium on the previous LTS (MPES §16.5). Edge is preinstalled on the runner.
      SEA_ENGINES: ${{ matrix.node == '24' && 'chromium,firefox,msedge' || 'chromium' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run check
      - run: npx playwright install ${{ env.SEA_ENGINES == 'chromium' && 'chromium' || 'chromium firefox' }}
      - run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-windows-${{ matrix.node }}
          path: .artifacts/test-results
          retention-days: 7
